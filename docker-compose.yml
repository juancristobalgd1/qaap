# Local or VPS deployment (Hetzner, Contabo, etc.).
#
#   cp .env.docker.example .env   # set QAAP_OAUTH_PUBLIC_URL + GitHub OAuth callback
#   docker compose up --build -d
#   open https://<QAAP_PUBLIC_HOST>  (Caddy) or http://127.0.0.1:4873 on the host
#
# Default IDE port is 4873 (not 3000) so Next/Vite dev servers can use :3000 inside the container.
# See packages/qaap-mobile-shell/src/common/qaap-ide-port.ts (QAAP_DOCKER_IDE_PORT).
# Theia binds to loopback only; Caddy publishes 80/443 with automatic HTTPS.

services:
  theia:
    # The backend is PID 1 and launches terminal/dev-server process trees for previews.
    # Use Docker's tiny init so exited grandchildren are reaped after stop/restart/kill.
    init: true
    # CI deploys set this to an immutable GHCR tag+digest. Local/VPS source builds keep the
    # explicit local tag and continue to use the build block below.
    image: ${QAAP_THEIA_IMAGE:-qaap-theia:local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        QAAP_IDE_PORT: ${THEIA_PORT:-4873}
        # Set by scripts/qaap-vps-update.sh to the deployed commit's short SHA.
        QAAP_BUILD_SHA: ${QAAP_BUILD_SHA:-dev}
        QAIQ_COMMIT: ${QAIQ_COMMIT:-1668998491d7265c754d94935b932cd9042f9b92}
        CODEX_CLI_VERSION: ${CODEX_CLI_VERSION:-0.144.5}
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-2.1.261}
        ANTIGRAVITY_CLI_VERSION: ${ANTIGRAVITY_CLI_VERSION:-0.1.1}
        OPENCODE_CLI_VERSION: ${OPENCODE_CLI_VERSION:-1.18.28}
        COPILOT_CLI_VERSION: ${COPILOT_CLI_VERSION:-1.0.83}
    ports:
      # Not world-reachable. Public traffic should hit Caddy on :443.
      - "127.0.0.1:${THEIA_PORT:-4873}:${THEIA_PORT:-4873}"
    extra_hosts:
      # Lets the control plane reach tenant backends published by the rootless host daemon.
      - "host.docker.internal:host-gateway"
    environment:
      # Theia backend defaults to production. For a private Docker Desktop smoke test, set
      # NODE_ENV=development and QAAP_CLOUD_MODE=local; hosted production requires a rootless
      # Docker socket and is rejected if it falls back to /var/run/docker.sock.
      NODE_ENV: ${NODE_ENV:-production}
      NODE_OPTIONS: ${QAAP_NODE_OPTIONS:---max-old-space-size=1536}
      HOST: 0.0.0.0
      PORT: "${THEIA_PORT:-4873}"
      # Theia's PTY fallback reads THEIA_SHELL, then SHELL. Docker does not populate either
      # automatically, so leaving both empty creates a process id that disappears immediately.
      SHELL: /bin/bash
      THEIA_SHELL: /bin/bash
      QAAP_GITHUB_CLIENT_ID: ${QAAP_GITHUB_CLIENT_ID:-}
      QAAP_GITHUB_CLIENT_SECRET: ${QAAP_GITHUB_CLIENT_SECRET:-}
      # Public IDE URL (must be https://… when Caddy terminates TLS).
      # Example: https://178.105.136.93.sslip.io
      QAAP_OAUTH_PUBLIC_URL: ${QAAP_OAUTH_PUBLIC_URL:-}
      QAAP_SKIP_AUTH: ${QAAP_SKIP_AUTH:-false}
      # Production denies admission until actual invited GitHub logins are configured.
      QAAP_BETA_ALLOWED_LOGINS: ${QAAP_BETA_ALLOWED_LOGINS:-}
      # Complete backend-per-tenant mode. Public beta refuses to start unless this is enabled
      # and the master secret is at least 32 characters; the secret is only used to derive the
      # loopback proxy assertion for each tenant backend.
      QAAP_BACKEND_PER_TENANT: ${QAAP_BACKEND_PER_TENANT:-0}
      QAAP_TENANT_BACKEND_MASTER_SECRET: ${QAAP_TENANT_BACKEND_MASTER_SECRET:-}
      # Production boot exits if OAuth is missing (NODE_ENV=production). Override only on a private box:
      QAAP_VAPID_PUBLIC_KEY: ${QAAP_VAPID_PUBLIC_KEY:-}
      QAAP_VAPID_PRIVATE_KEY: ${QAAP_VAPID_PRIVATE_KEY:-}
      QAAP_VAPID_SUBJECT: ${QAAP_VAPID_SUBJECT:-mailto:qaap@localhost}
      # Background-agent CLI template for Jobs tasks ({prompt} = task description).
      QAAP_AGENT_COMMAND: ${QAAP_AGENT_COMMAND:-}
      QAAP_AGENT_COMMANDS: ${QAAP_AGENT_COMMANDS:-}
      QAAP_DEFAULT_AGENT: ${QAAP_DEFAULT_AGENT:-qaiq}
      # Agent CLI update toast: set QAAP_AGENT_CLI_UPDATE_CHECK=0 to disable boot probes / npm lookups.
      QAAP_AGENT_CLI_UPDATE_CHECK: ${QAAP_AGENT_CLI_UPDATE_CHECK:-0}
      # Optional min-version fallback when npm registry is unreachable (Codex pin is also a build arg).
      CODEX_CLI_VERSION: ${CODEX_CLI_VERSION:-}
      CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-}
      OPENCODE_CLI_VERSION: ${OPENCODE_CLI_VERSION:-}
      COPILOT_CLI_VERSION: ${COPILOT_CLI_VERSION:-}
      ANTIGRAVITY_CLI_VERSION: ${ANTIGRAVITY_CLI_VERSION:-}
      QAAP_QAIQ_MIN_VERSION: ${QAAP_QAIQ_MIN_VERSION:-}
      # Cursor-like same-session queue: one follow-up per drained turn, short coalesce.
      QAAP_MAX_BATCH_SIZE: ${QAAP_MAX_BATCH_SIZE:-1}
      QAAP_COALESCE_WINDOW_MS: ${QAAP_COALESCE_WINDOW_MS:-400}
      # Hard backend cap for distinct variants in a parallel run (demo script uses 2).
      QAAP_MAX_PARALLEL_VARIANTS: ${QAAP_MAX_PARALLEL_VARIANTS:-3}
      # Agent processes dominate memory. Defaults leave headroom for Parallel×2 on a 4 GiB box;
      # raise via .env for the live event window (see doc/qaap-demo-rehearsal-checklist.md).
      QAAP_MAX_CONCURRENT_AGENTS: ${QAAP_MAX_CONCURRENT_AGENTS:-3}
      QAAP_MAX_CONCURRENT_AGENTS_PER_USER: ${QAAP_MAX_CONCURRENT_AGENTS_PER_USER:-3}
      QAAP_MAX_QUEUED_AGENTS: ${QAAP_MAX_QUEUED_AGENTS:-100}
      QAAP_MAX_QUEUED_AGENTS_PER_USER: ${QAAP_MAX_QUEUED_AGENTS_PER_USER:-20}
      QAAP_AGENT_VERIFY_MAX_CONCURRENT: ${QAAP_AGENT_VERIFY_MAX_CONCURRENT:-1}
      # Agent-independent job scheduler: global/per-user caps and isolated resource lanes.
      QAAP_JOB_MAX_CONCURRENT: ${QAAP_JOB_MAX_CONCURRENT:-4}
      QAAP_JOB_MAX_CONCURRENT_PER_USER: ${QAAP_JOB_MAX_CONCURRENT_PER_USER:-2}
      QAAP_JOB_LIMIT_CPU: ${QAAP_JOB_LIMIT_CPU:-1}
      QAAP_JOB_LIMIT_IO: ${QAAP_JOB_LIMIT_IO:-4}
      QAAP_JOB_LIMIT_NETWORK: ${QAAP_JOB_LIMIT_NETWORK:-2}
      QAAP_JOB_LIMIT_WORKSPACE: ${QAAP_JOB_LIMIT_WORKSPACE:-2}
      QAAP_JOB_LIMIT_DEPLOYMENT: ${QAAP_JOB_LIMIT_DEPLOYMENT:-1}
      QAAP_JOB_MAX_TIMEOUT_MS: ${QAAP_JOB_MAX_TIMEOUT_MS:-7200000}
      QAAP_JOB_MAX_LOG_CHARS: ${QAAP_JOB_MAX_LOG_CHARS:-524288}
      QAAP_JOB_LOOP_MAX_JOBS: ${QAAP_JOB_LOOP_MAX_JOBS:-512}
      QAAP_JOB_LOOP_MAX_ACTIVE_PER_USER: ${QAAP_JOB_LOOP_MAX_ACTIVE_PER_USER:-2}
      QAAP_JOB_LOOP_TRIGGER_LEASE_TTL_MS: ${QAAP_JOB_LOOP_TRIGGER_LEASE_TTL_MS:-600000}
      QAAP_JOB_LOOP_MANAGEMENT_LOCK_TTL_MS: ${QAAP_JOB_LOOP_MANAGEMENT_LOCK_TTL_MS:-30000}
      QAAP_JOB_LOOP_MANAGEMENT_LOCK_TIMEOUT_MS: ${QAAP_JOB_LOOP_MANAGEMENT_LOCK_TIMEOUT_MS:-5000}
      # Bundled Qaap slash skills (global). Custom user skills: ~/.qaap/users/{login}/skills
      QAAP_SYSTEM_SKILLS_DIR: ${QAAP_SYSTEM_SKILLS_DIR:-/opt/qaap/system-skills}
      # Default-on backend self-verification: after an agent task edits files, run the project's
      # typecheck/build/test scripts and, on failure, spawn up to 2 fix turns (5-min cap).
      # Set QAAP_AGENT_VERIFY=0 (or false/off) in the VPS env to disable it explicitly.
      QAAP_AGENT_VERIFY: ${QAAP_AGENT_VERIFY:-}
      # Strict mode: set QAAP_AGENT_AUTO_CONTINUE=0 to stop the agent from auto-continuing after a
      # turn — it does only what the user asked and stops. Default on.
      QAAP_AGENT_AUTO_CONTINUE: ${QAAP_AGENT_AUTO_CONTINUE:-}
      # Security: run the spawned agent under a non-root uid so it cannot read other tenants' secrets
      # under /root (API keys, OAuth tokens, helper tokens). The image ships a qaap-agent user (uid
      # 1001) and chowns /workspace + the agent home to it, so the drop is safe by DEFAULT — and the
      # backend refuses to spawn a root agent in a production runtime. Default to 1001 (matching
      # the image's ENV); an empty default here would have OVERRIDDEN that ENV back to root. Root
      # execution has no production escape hatch; use NODE_ENV=development + QAAP_CLOUD_MODE=local
      # only for a deliberate single-user development run.
      QAAP_AGENT_UID: ${QAAP_AGENT_UID:-1001}
      QAAP_AGENT_GID: ${QAAP_AGENT_GID:-1001}
      QAAP_AGENT_HOME: ${QAAP_AGENT_HOME:-/home/qaap-agent}
      # Multi-tenant CODE isolation (SEC-1). Default ON for the legacy host fallback → each GitHub
      # login gets a distinct persistent uid (20000+) when the backend has the privilege to provision
      # it. Hosted worker-container mode does not need this host-side chown path: the worker boundary
      # and its non-root uid are primary. Keep the flag on so a deliberate host fallback remains
      # fail-closed; read doc/qaap-uid-per-user.md before changing ownership policy.
      QAAP_AGENT_UID_PER_USER: ${QAAP_AGENT_UID_PER_USER:-1}
      # Where per-tenant agent HOMEs live (image provisions /home/qaap-tenants at 0711). Only used
      # when uid-per-user is on.
      QAAP_TENANT_HOME_ROOT: ${QAAP_TENANT_HOME_ROOT:-/home/qaap-tenants}
      # Persistent login→uid map (root-owned, outside every tenant tree). Defaults to
      # /workspace/.qaap/uid-registry.json (on the theia-workspace volume, so it survives rebuilds).
      QAAP_TENANT_UID_REGISTRY_PATH: ${QAAP_TENANT_UID_REGISTRY_PATH:-}
      # Opt-in relevance retrieval: ripgrep the user's message keywords over the repo and inject the
      # top matching file paths as a "likely relevant files" hint (Cursor-style priming). Adds a small
      # per-turn token + ripgrep cost — set QAAP_AGENT_RETRIEVAL=1 and measure. Default off.
      QAAP_CLOUD_MODE: ${QAAP_CLOUD_MODE:-docker}
      # Container-per-tenant isolation: each user runs agents and terminals in an isolated worker container.
      QAAP_TENANT_CONTAINER_ISOLATION: ${QAAP_TENANT_CONTAINER_ISOLATION:-1}
      QAAP_TENANT_MEMORY_LIMIT: ${QAAP_TENANT_MEMORY_LIMIT:-2147483648}
      QAAP_TENANT_CPU_LIMIT: ${QAAP_TENANT_CPU_LIMIT:-2}
      QAAP_TENANT_PIDS_LIMIT: ${QAAP_TENANT_PIDS_LIMIT:-256}
      QAAP_TENANT_CONTAINER_UID: ${QAAP_TENANT_CONTAINER_UID:-1000}
      QAAP_TENANT_CONTAINER_GID: ${QAAP_TENANT_CONTAINER_GID:-1000}
      # Set only when DOCKER_HOST points at a rootless daemon. Container uid 0 then maps to the
      # unprivileged host account owning the persistent bind mounts, allowing shared 0700 state.
      QAAP_DOCKER_ROOTLESS: ${QAAP_DOCKER_ROOTLESS:-0}
      # Never use Docker's shared default bridge for untrusted tenant workers. The backend creates
      # one managed bridge per tenant (or use `none` with an external egress proxy).
      QAAP_TENANT_NETWORK_MODE: ${QAAP_TENANT_NETWORK_MODE:-isolated-bridge}
      # Billing / Stripe Checkout (Pro €29, Team €79). Without these, Work Hub Billing shows
      # stripeEnabled=false and POST /qaap/api/billing/checkout returns 503.
      # Public origin for Checkout success/cancel URLs (prefer the Caddy HTTPS host).
      QAAP_PUBLIC_URL: ${QAAP_PUBLIC_URL:-}
      QAAP_BILLING_DEFAULT_PLAN: ${QAAP_BILLING_DEFAULT_PLAN:-}
      QAAP_BILLING_STORE_PATH: ${QAAP_BILLING_STORE_PATH:-}
      # Local-only plan preview when Stripe keys are absent. Must stay unset on a public VPS.
      QAAP_BILLING_DEV_CHECKOUT: ${QAAP_BILLING_DEV_CHECKOUT:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_PRO_MONTHLY: ${STRIPE_PRICE_PRO_MONTHLY:-}
      STRIPE_PRICE_TEAM_MONTHLY: ${STRIPE_PRICE_TEAM_MONTHLY:-}
      # BYOK / free-tier keys for @qaiq background jobs (also set in Settings → AI).
      # Explicit env vars here override empty preferences; see doc/qaap-vps-deployment.md.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Optional Gemini metadata probing. Keep disabled in production because the provider's
      # models.get endpoint is not required for generation and may reject valid model ids.
      QAAP_GOOGLE_MODEL_METADATA: ${QAAP_GOOGLE_MODEL_METADATA:-0}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      OLLAMA_HOST: ${OLLAMA_HOST:-}
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY:-}
      # Web search for @qaiq: the bundled SearXNG service (free, no API key, Docker only).
      # QAIQ's WebSearch selects the custom->searxng provider; all four WEB_* must be set
      # together. SearXNG lives on the private compose network (http, private host), so the
      # SSRF guardrails are opened for it. See the `searxng` service below.
      WEB_SEARCH_PROVIDER: ${WEB_SEARCH_PROVIDER:-custom}
      WEB_PROVIDER: ${WEB_PROVIDER:-searxng}
      WEB_SEARCH_API: ${WEB_SEARCH_API:-http://searxng:8080/search?format=json}
      WEB_CUSTOM_ALLOW_PRIVATE: ${WEB_CUSTOM_ALLOW_PRIVATE:-true}
      WEB_CUSTOM_ALLOW_HTTP: ${WEB_CUSTOM_ALLOW_HTTP:-true}
      # Send tool schemas eagerly instead of deferring them behind a ToolSearch meta-tool.
      # QAIQ defers `shouldDefer` tools (incl. WebSearch) by default via Anthropic's
      # tool_reference beta — but that transport isn't honored over OpenAI-compat/OpenRouter
      # (how the free models here run), so a deferred WebSearch never reaches the model and it
      # answers "I have no web access". `false` = standard mode: WebSearch ships in turn 1.
      ENABLE_TOOL_SEARCH: ${ENABLE_TOOL_SEARCH:-false}
      # Optional: mount a host folder as the default workspace
      # THEIA_PLUGINS_DIR: /app/plugins
      # Hosted deployments must use a rootless Docker socket. The secure default is the usual
      # rootless-per-user socket; local Docker Desktop users must override this explicitly in .env.
      DOCKER_HOST: ${DOCKER_HOST:-unix:///run/user/1000/docker.sock}
      # When the control plane runs in a container, translate its mounted paths to the paths
      # visible to the rootless Docker daemon on the VPS host.
      QAAP_DOCKER_REMOTE_REPOS_ROOT: ${QAAP_DOCKER_REMOTE_REPOS_ROOT:-}
      QAAP_DOCKER_REMOTE_WORKTREES_ROOT: ${QAAP_DOCKER_REMOTE_WORKTREES_ROOT:-}
      QAAP_DOCKER_REMOTE_PARALLEL_ROOT: ${QAAP_DOCKER_REMOTE_PARALLEL_ROOT:-}
      QAAP_DOCKER_REMOTE_TENANT_CONFIG_ROOT: ${QAAP_DOCKER_REMOTE_TENANT_CONFIG_ROOT:-}
      QAAP_DOCKER_NODES: ${QAAP_DOCKER_NODES:-}
      # The worker must use the same image so qaiq/codex/claude binaries and the non-root uid exist
      # inside the tenant container. In production set this to the immutable deployed image tag.
      QAAP_THEIA_IMAGE: ${QAAP_THEIA_IMAGE:-qaap-theia:local}
      # An explicit worker image is supported for split deployments, but defaults to the exact
      # serving image. Both images must contain the harnesses validated by the Dockerfile gate.
      QAAP_TENANT_DOCKER_IMAGE: ${QAAP_TENANT_DOCKER_IMAGE:-${QAAP_THEIA_IMAGE:-qaap-theia:local}}
    depends_on:
      - searxng
    volumes:
      - ${QAAP_WORKSPACE_SOURCE:-theia-workspace}:/workspace
      # Persist GitHub OAuth, agent-task index, qaap-task helper token.
      - ${QAAP_AUTH_DATA_SOURCE:-qaap-auth-data}:/home/theia/.qaap
      # Persist Settings → AI keys and user preferences across rebuilds.
      - ${QAAP_THEIA_USER_SOURCE:-qaap-theia-user}:/home/theia/.theia
      # Preserve absolute worktree paths used by Git and persisted conversations.
      # Existing deployments with state in the writable layer MUST run
      # qaap-persist-runtime-state.mjs --apply first. The updater preserves the legacy
      # /opt/qaap-runtime bind layout automatically.
      - ${QAAP_WORKTREES_SOURCE:-theia-worktrees}:/tmp/qaap-worktrees
      - ${QAAP_PARALLEL_SOURCE:-theia-parallel}:/tmp/qaap-parallel
      - ${QAAP_TENANT_HOMES_SOURCE:-qaap-tenant-homes}:/home/qaap-tenants
      # Rootless default: /run/user/1000/docker.sock:/run/user/1000/docker.sock. Never make a
      # rootful host socket the compose fallback; hosted admission rejects it, but the mount itself
      # would still expose a dangerous control-plane capability to a compromised backend.
      - ${QAAP_DOCKER_SOCKET_SOURCE:-/run/user/1000/docker.sock}:${QAAP_DOCKER_SOCKET_TARGET:-/run/user/1000/docker.sock}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
          # A runaway agent/process tree must fail locally instead of exhausting the host.
          pids: ${QAAP_THEIA_PIDS_LIMIT:-512}

  # Free, self-hosted web search for @qaiq — no API key, only Docker. Reachable ONLY from
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - theia
    ports:
      - "80:80"
      - "443:443"
    environment:
      QAAP_PUBLIC_HOST: ${QAAP_PUBLIC_HOST:-localhost}
      THEIA_PORT: ${THEIA_PORT:-4873}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # the theia backend over the compose network (no host port published). Config + JSON-format
  # toggle live in deploy/searxng/settings.yml.
  searxng:
    # Pinned by digest for reproducible deploys — `:latest` can change under any `up` and ship
    # settings-incompatible builds (that is how the crash-loop happened). Digest is 2026.7.10.
    # Bump deliberately: docker pull searxng/searxng:latest && docker inspect --format '{{index .RepoDigests 0}}'.
    image: searxng/searxng@sha256:1e9c9535cffd1d9d209985905091308257e23b2f4783fbd3b626c0a56285b80c
    # secret_key lives in deploy/searxng/settings.yml (the image only auto-generates one when it
    # creates settings.yml from its template — since we ship our own file, we set it there).
    volumes:
      - ./deploy/searxng:/etc/searxng:rw
    restart: unless-stopped
    # Surface crash-loops / up-but-broken searxng as "unhealthy" in `docker compose ps` and to the
    # deploy script. NOT wired into theia's depends_on on purpose: search is a feature, not the IDE,
    # so a broken searxng must never block the whole IDE from starting. start_period is generous
    # because a cold searxng takes ~45s to answer.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  theia-workspace:
  qaap-auth-data:
  qaap-theia-user:
  theia-worktrees:
  theia-parallel:
  qaap-tenant-homes:
  caddy_data:
  caddy_config:
