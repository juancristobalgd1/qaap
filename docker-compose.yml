# Local or VPS deployment (Hetzner, Contabo, etc.).
#
#   cp .env.docker.example .env   # set QAAP_OAUTH_PUBLIC_URL + GitHub OAuth callback
#   docker compose up --build -d
#   open http://localhost:4873
#
# Default IDE port is 4873 (not 3000) so Next/Vite dev servers can use :3000 inside the container.
# See packages/qaap-mobile-shell/src/common/qaap-ide-port.ts (QAAP_DOCKER_IDE_PORT).

services:
  theia:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        QAAP_IDE_PORT: ${THEIA_PORT:-4873}
        CODEX_CLI_VERSION: ${CODEX_CLI_VERSION:-latest}
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-latest}
        ANTIGRAVITY_CLI_VERSION: ${ANTIGRAVITY_CLI_VERSION:-latest}
        OPENCODE_CLI_VERSION: ${OPENCODE_CLI_VERSION:-latest}
        COPILOT_CLI_VERSION: ${COPILOT_CLI_VERSION:-latest}
    ports:
      - "${THEIA_PORT:-4873}:${THEIA_PORT:-4873}"
    environment:
      # Theia backend runs in production mode; project bootstrap install uses
      # NODE_ENV=development / npm --include=dev so Vite/Next devDependencies are installed.
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "${THEIA_PORT:-4873}"
      QAAP_GITHUB_CLIENT_ID: ${QAAP_GITHUB_CLIENT_ID:-}
      QAAP_GITHUB_CLIENT_SECRET: ${QAAP_GITHUB_CLIENT_SECRET:-}
      # Public IDE URL, e.g. http://178.105.136.93:4873 (OAuth + dev preview /qaap-dev/<port>/)
      QAAP_OAUTH_PUBLIC_URL: ${QAAP_OAUTH_PUBLIC_URL:-}
      QAAP_SKIP_AUTH: ${QAAP_SKIP_AUTH:-false}
      QAAP_VAPID_PUBLIC_KEY: ${QAAP_VAPID_PUBLIC_KEY:-}
      QAAP_VAPID_PRIVATE_KEY: ${QAAP_VAPID_PRIVATE_KEY:-}
      QAAP_VAPID_SUBJECT: ${QAAP_VAPID_SUBJECT:-mailto:qaap@localhost}
      # Background-agent CLI template for Jobs tasks ({prompt} = task description).
      QAAP_AGENT_COMMAND: ${QAAP_AGENT_COMMAND:-}
      QAAP_AGENT_COMMANDS: ${QAAP_AGENT_COMMANDS:-}
      QAAP_DEFAULT_AGENT: ${QAAP_DEFAULT_AGENT:-qaiq}
      # Opt-in backend self-verification: after a QAIQ task edits files, run the project's
      # typecheck/build/test scripts and, on failure, spawn up to 2 fix turns (5-min cap).
      # Default off; set QAAP_AGENT_VERIFY=1 in the VPS env to enable.
      QAAP_AGENT_VERIFY: ${QAAP_AGENT_VERIFY:-}
      # Strict mode: set QAAP_AGENT_AUTO_CONTINUE=0 to stop the agent from auto-continuing after a
      # turn — it does only what the user asked and stops. Default on.
      QAAP_AGENT_AUTO_CONTINUE: ${QAAP_AGENT_AUTO_CONTINUE:-}
      # Security: run the spawned agent under a non-root uid so it cannot read other tenants' secrets
      # under /root (API keys, OAuth tokens, helper tokens). The image ships a qaap-agent user (uid
      # 1001) and chowns /workspace + the agent home to it, so the drop is safe by DEFAULT — and the
      # backend refuses to spawn a root agent in a production runtime anyway. Default to 1001 (matching
      # the image's ENV); an empty default here would have OVERRIDDEN that ENV back to root. Set
      # QAAP_AGENT_UID= (empty) + QAAP_ALLOW_ROOT_AGENT_IN_PRODUCTION=true only if you truly need root.
      QAAP_AGENT_UID: ${QAAP_AGENT_UID:-1001}
      QAAP_AGENT_GID: ${QAAP_AGENT_GID:-1001}
      QAAP_AGENT_HOME: ${QAAP_AGENT_HOME:-/home/qaap-agent}
      # Opt-in relevance retrieval: ripgrep the user's message keywords over the repo and inject the
      # top matching file paths as a "likely relevant files" hint (Cursor-style priming). Adds a small
      # per-turn token + ripgrep cost — set QAAP_AGENT_RETRIEVAL=1 and measure. Default off.
      QAAP_AGENT_RETRIEVAL: ${QAAP_AGENT_RETRIEVAL:-}
      QAAP_CLOUD_MODE: ${QAAP_CLOUD_MODE:-local}
      # BYOK / free-tier keys for @qaiq background jobs (also set in Settings → AI).
      # Explicit env vars here override empty preferences; see doc/qaap-vps-deployment.md.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      OLLAMA_HOST: ${OLLAMA_HOST:-}
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY:-}
      # Web search for @qaiq: the bundled SearXNG service (free, no API key, Docker only).
      # QAIQ's WebSearch selects the custom->searxng provider; all four WEB_* must be set
      # together. SearXNG lives on the private compose network (http, private host), so the
      # SSRF guardrails are opened for it. See the `searxng` service below.
      WEB_SEARCH_PROVIDER: ${WEB_SEARCH_PROVIDER:-custom}
      WEB_PROVIDER: ${WEB_PROVIDER:-searxng}
      WEB_SEARCH_API: ${WEB_SEARCH_API:-http://searxng:8080/search?format=json}
      WEB_CUSTOM_ALLOW_PRIVATE: ${WEB_CUSTOM_ALLOW_PRIVATE:-true}
      WEB_CUSTOM_ALLOW_HTTP: ${WEB_CUSTOM_ALLOW_HTTP:-true}
      # Send tool schemas eagerly instead of deferring them behind a ToolSearch meta-tool.
      # QAIQ defers `shouldDefer` tools (incl. WebSearch) by default via Anthropic's
      # tool_reference beta — but that transport isn't honored over OpenAI-compat/OpenRouter
      # (how the free models here run), so a deferred WebSearch never reaches the model and it
      # answers "I have no web access". `false` = standard mode: WebSearch ships in turn 1.
      ENABLE_TOOL_SEARCH: ${ENABLE_TOOL_SEARCH:-false}
      # Optional: mount a host folder as the default workspace
      # THEIA_PLUGINS_DIR: /app/plugins
    depends_on:
      - searxng
    volumes:
      - theia-workspace:/workspace
      # Persist GitHub OAuth, agent-task index, qaap-task helper token.
      - qaap-auth-data:/root/.qaap
      # Persist Settings → AI keys and user preferences across rebuilds.
      - qaap-theia-user:/root/.theia
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G

  # Free, self-hosted web search for @qaiq — no API key, only Docker. Reachable ONLY from
  # the theia backend over the compose network (no host port published). Config + JSON-format
  # toggle live in deploy/searxng/settings.yml.
  searxng:
    # Pinned by digest for reproducible deploys — `:latest` can change under any `up` and ship
    # settings-incompatible builds (that is how the crash-loop happened). Digest is 2026.7.10.
    # Bump deliberately: docker pull searxng/searxng:latest && docker inspect --format '{{index .RepoDigests 0}}'.
    image: searxng/searxng@sha256:1e9c9535cffd1d9d209985905091308257e23b2f4783fbd3b626c0a56285b80c
    # secret_key lives in deploy/searxng/settings.yml (the image only auto-generates one when it
    # creates settings.yml from its template — since we ship our own file, we set it there).
    volumes:
      - ./deploy/searxng:/etc/searxng:rw
    restart: unless-stopped
    # Surface crash-loops / up-but-broken searxng as "unhealthy" in `docker compose ps` and to the
    # deploy script. NOT wired into theia's depends_on on purpose: search is a feature, not the IDE,
    # so a broken searxng must never block the whole IDE from starting. start_period is generous
    # because a cold searxng takes ~45s to answer.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  theia-workspace:
  qaap-auth-data:
  qaap-theia-user:
