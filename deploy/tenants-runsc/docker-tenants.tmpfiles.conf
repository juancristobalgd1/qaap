# /etc/tmpfiles.d/docker-tenants.conf
# Runtime directory of the gVisor tenant daemon and its socket proxy.
# Group qaap-tenants-client is the group of the proxy socket: the control plane gets it as a
# supplementary group. The directory is 0750, so only root, the proxy and the control plane
# can traverse it. The raw daemon socket is group qaap-tenants-backend, which only the proxy
# user belongs to.
#   Type Path                 Mode  User Group                 Age
d     /run/docker-tenants    0750  root qaap-tenants-client   -
