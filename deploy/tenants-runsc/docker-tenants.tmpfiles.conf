# /etc/tmpfiles.d/docker-tenants.conf
# Runtime directory of the gVisor tenant daemon: its raw socket (root on the host), exec-root and
# pidfile. Group qaap-tenants-backend, which only the proxy user belongs to, so the control plane
# cannot even traverse to the raw socket. The proxy listens in its own directory,
# /run/docker-tenants-proxy, created by RuntimeDirectory= in docker-tenants-socket-proxy.service.
#   Type Path                 Mode  User Group                 Age
d     /run/docker-tenants    0750  root qaap-tenants-backend  -
