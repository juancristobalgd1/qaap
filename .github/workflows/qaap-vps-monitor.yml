# Synthetic uptime monitor for the production VPS.
# Every 15 minutes: hit the public config endpoint; on failure open (or reuse) a "vps-down"
# issue so the operator hears about an outage before the users do. When the VPS recovers,
# the next green run closes the issue automatically — no manual bookkeeping.
name: Qaap VPS monitor

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: qaap-vps-monitor
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.repository == 'juancristobalgd1/qaap'
    steps:
      - name: Checkout URL normalizer
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: |
            scripts/qaap-vps-normalize-public-url.sh
            scripts/qaap-verify-auth-api-gate.sh
          sparse-checkout-cone-mode: false

      - name: Probe public endpoint
        id: probe
        env:
          QAAP_VPS_PUBLIC_URL: ${{ secrets.QAAP_VPS_PUBLIC_URL }}
        run: |
          # shellcheck source=scripts/qaap-vps-normalize-public-url.sh
          source ./scripts/qaap-vps-normalize-public-url.sh
          QAAP_VPS_PUBLIC_URL="$(qaap_normalize_vps_public_url "$QAAP_VPS_PUBLIC_URL")"
          if [ -z "$QAAP_VPS_PUBLIC_URL" ]; then
            echo "QAAP_VPS_PUBLIC_URL not set — nothing to monitor"
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Last non-healthy health answer (HTTP code + body, truncated); its presence means "degraded".
          DETAIL_FILE="$RUNNER_TEMP/vps-health-detail.txt"
          HEALTH_BODY_FILE="$RUNNER_TEMP/vps-health-body.txt"
          rm -f "$DETAIL_FILE"
          # 3 attempts, 20s apart: a single blip must not page anyone.
          for attempt in 1 2 3; do
            # Health answers with its own status: 2xx is healthy, any other answer (e.g. 503 with a JSON body)
            # is degraded and never masked. Only "no response at all" (000) falls back to the public auth config.
            HEALTH_CODE="$(curl -sS --max-time 15 -o "$HEALTH_BODY_FILE" -w '%{http_code}' "$QAAP_VPS_PUBLIC_URL/qaap/api/health" 2>/dev/null || true)"
            HEALTH_CODE="${HEALTH_CODE:-000}"
            HEALTH="$(cat "$HEALTH_BODY_FILE" 2>/dev/null || true)"
            case "$HEALTH_CODE" in
              2??)
                BUILD="$(printf '%s' "$HEALTH" | jq -r '.build // empty' 2>/dev/null || true)"
                echo "healthy (attempt $attempt) — build=${BUILD:-unknown}"
                echo "status=healthy" >> "$GITHUB_OUTPUT"
                echo "build=$BUILD" >> "$GITHUB_OUTPUT"
                chmod +x ./scripts/qaap-verify-auth-api-gate.sh
                QAAP_BASE_URL="$QAAP_VPS_PUBLIC_URL" ./scripts/qaap-verify-auth-api-gate.sh
                exit 0
                ;;
              000)
                CONFIG="$(curl -fsS --max-time 15 "$QAAP_VPS_PUBLIC_URL/qaap/api/auth/config" 2>/dev/null || true)"
                BUILD="$(printf '%s' "$CONFIG" | jq -r '.build // empty' 2>/dev/null || true)"
                if [ -n "$CONFIG" ]; then
                  echo "healthy via auth config (attempt $attempt, health gave no response) — build=${BUILD:-unknown}"
                  echo "status=healthy" >> "$GITHUB_OUTPUT"
                  echo "build=$BUILD" >> "$GITHUB_OUTPUT"
                  chmod +x ./scripts/qaap-verify-auth-api-gate.sh
                  QAAP_BASE_URL="$QAAP_VPS_PUBLIC_URL" ./scripts/qaap-verify-auth-api-gate.sh
                  exit 0
                fi
                echo "attempt $attempt: no response from health or auth config"
                ;;
              *)
                echo "attempt $attempt: health answered HTTP $HEALTH_CODE"
                printf 'HTTP %s\n%s\n' "$HEALTH_CODE" "$(printf '%s' "$HEALTH" | head -c 1500)" > "$DETAIL_FILE"
                ;;
            esac
            [ "$attempt" -lt 3 ] && sleep 20
          done
          if [ -s "$DETAIL_FILE" ]; then
            echo "status=degraded" >> "$GITHUB_OUTPUT"
          else
            echo "status=down" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or reuse the outage issue
        if: steps.probe.outputs.status == 'down' || steps.probe.outputs.status == 'degraded'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Issues can be disabled on the repo; the workflow failure itself (GitHub emails the
          # owner about failed scheduled runs) is then the alert channel.
          if ! gh issue list --limit 1 >/dev/null 2>&1; then
            echo "::warning::Repository has Issues disabled — enable them (Settings → Features → Issues) for outage tracking. Failing the run so the scheduled-failure email still alerts."
            exit 1
          fi
          EXISTING="$(gh issue list --label vps-down --state open --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Still ${{ steps.probe.outputs.status }} at $(date -u +%FT%TZ) (monitor run ${{ github.run_id }})."
            echo "commented on existing issue #$EXISTING"
          else
            gh label create vps-down --description "Production VPS unreachable" --color B60205 2>/dev/null || true
            BODY="$(printf '%s\n' \
              "The synthetic monitor did not get a healthy answer from \`/qaap/api/health\` after 3 attempts at $(date -u +%FT%TZ) (status: ${{ steps.probe.outputs.status }})." \
              '' \
              '**Check:**' \
              '1. `ssh root@<vps>` → `cd /opt/qaap && docker compose ps` and `docker compose logs --since 30m theia`' \
              '2. Provider status / disk space (`df -h`).' \
              '3. This issue closes automatically when the monitor sees the endpoint healthy again.' \
              '' \
              'Monitor run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}')"
            if [ -s "$RUNNER_TEMP/vps-health-detail.txt" ]; then
              BODY="$BODY"$'\n\n**Last health answer:**\n```\n'"$(cat "$RUNNER_TEMP/vps-health-detail.txt")"$'\n```'
            fi
            gh issue create \
              --title "🔴 VPS down: public endpoint unreachable" \
              --label vps-down \
              --body "$BODY"
            echo "opened new outage issue"
          fi
          exit 1

      - name: Auto-close the outage issue on recovery
        if: steps.probe.outputs.status == 'healthy'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh issue list --limit 1 >/dev/null 2>&1; then
            echo "issues disabled — nothing to close"
            exit 0
          fi
          EXISTING="$(gh issue list --label vps-down --state open --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --comment "Recovered: endpoint healthy again at $(date -u +%FT%TZ) (build ${{ steps.probe.outputs.build || 'unknown' }})."
            echo "closed issue #$EXISTING"
          else
            echo "healthy — nothing to close"
          fi
