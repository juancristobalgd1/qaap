# Build Qaap once in CI, publish it to GHCR, then pull it on the production VPS over SSH.
# One-time setup: doc/qaap-vps-deployment.md → "Automated deploy"
name: Qaap VPS deploy

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Git branch to deploy on the VPS
        required: false
        default: master
        type: string
      no_cache:
        description: Rebuild Docker image without cache
        required: false
        default: false
        type: boolean
      skip_gate:
        description: Skip the pre-deploy smoke gate (emergency only)
        required: false
        default: false
        type: boolean
      skip_agent_smoke:
        description: Skip the post-deploy agent turn (one short real LLM turn per deploy)
        required: false
        default: false
        type: boolean
  push:
    branches:
      - master
    paths-ignore:
      - '**/*.md'
      - 'doc/**'
      - 'logo/**'
      - '.github/**'
      - 'examples/playwright/**'
      # Test-only changes are proven by PR CI; they never change what runs in production.
      - '**/*.spec.ts'
      - '**/*.spec.tsx'
      - '**/*.spec.js'

concurrency:
  group: qaap-vps-deploy
  # Never abort an in-flight publish/SSH deploy. A newer push waits its turn.
  cancel-in-progress: false

env:
  QAAP_DEPLOY_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || 'master' }}

jobs:
  resolve_source:
    name: Resolve release commit once
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.repository == 'juancristobalgd1/qaap'
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Checkout requested revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'push' && github.sha || env.QAAP_DEPLOY_BRANCH }}
      - name: Record immutable revision
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Pre-deploy smoke gate: build the browser app, boot it with the mock QAIQ agent, and run the
  # Rioja composer UI-flow eval — which now also asserts runtime shell health (the DI container
  # actually registered its commands). This catches runtime-only regressions that pass compile
  # and build:browser. The deploy job depends on this, so a red gate blocks the VPS deploy.
  gate:
    name: Pre-deploy smoke gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: resolve_source
    if: github.repository == 'juancristobalgd1/qaap' && github.event.inputs.skip_gate != 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.resolve_source.outputs.sha }}

      - name: Use Node.js 24.x
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Use Python 3.13
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'

      - name: Install native-keymap build deps
        shell: bash
        run: bash scripts/qaap-ci-install-native-deps.sh

      - name: Build browser app
        shell: bash
        run: |
          # The checkout is the deployed ref, which may predate the retry helper (rollback deploys).
          if [[ -f scripts/qaap-npm-ci-retry.sh ]]; then
            bash scripts/qaap-npm-ci-retry.sh --include=optional
          else
            npm ci --include=optional
          fi
          npm run build:browser
        env:
          NODE_OPTIONS: --max_old_space_size=4096
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Playwright Chromium
        shell: bash
        run: cd examples/playwright && npx playwright install chromium

      - name: Start browser backend with mock QAIQ
        shell: bash
        # The eval drives the composer UI, which only mounts once past the Work Hub login gate. With
        # no GitHub OAuth configured in CI, the gate shows "sign-in unavailable" and #theia-app-shell
        # never renders — so the gate must boot in skip-auth (local-dev) mode. QAAP_CLOUD_MODE=local
        # keeps QAAP_SKIP_AUTH honored (it is refused in a production runtime).
        env:
          QAAP_SKIP_AUTH: 'true'
          # The mock QAIQ ignores it, but the runner starts a QAIQ task only with a configured provider
          # (the Ollama schema default stopped counting as one); without it every turn fails before spawn.
          OPENROUTER_API_KEY: mock-rioja-e2e
          QAAP_CLOUD_MODE: local
        run: |
          MOCK_BIN="${{ github.workspace }}/test-results/mock-qaiq-bin"
          mkdir -p "${MOCK_BIN}"
          ln -sf "${{ github.workspace }}/examples/playwright/scripts/mock-qaiq-rioja-agent" "${MOCK_BIN}/qaiq"
          echo "${MOCK_BIN}" >> "${GITHUB_PATH}"
          # GITHUB_PATH only affects *subsequent* steps; the backend is started in THIS step and
          # detects agents with `which qaiq`, so it must have the mock on its own PATH.
          export PATH="${MOCK_BIN}:${PATH}"
          cd examples/browser
          npm run start > "${{ github.workspace }}/test-results/browser-server.log" 2>&1 &
          echo $! > "${{ github.workspace }}/test-results/browser-server.pid"
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:3000 >/dev/null; then
              echo "Server ready after ${i} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "Server failed to start"
          tail -n 80 "${{ github.workspace }}/test-results/browser-server.log" || true
          exit 1

      - name: Rioja composer UI flow eval (P0 gate + shell health)
        shell: bash
        run: cd examples/playwright && npm run rioja-ui-flow-eval

      # A chat turn must survive the backend dying under it (OOM, deploy): SIGKILL the backend
      # mid-turn, restart it, and require the boot-time auto-resume to finish the turn. Uses its own
      # backend on :3466 with an isolated HOME and a fake qaiq; ~10 s.
      - name: Restart-resume e2e (turn survives a backend kill)
        shell: bash
        run: node scripts/qaap-restart-resume-e2e.mjs --port 3466

      # Every Work Hub task ends in a PR carrying its evidence (doc/qaap-task-to-pr.md): one chat turn
      # with a fake qaiq must push refs/heads/qaap/task/<id> to a local bare origin and open a PR on a
      # local GitHub stub whose body has the checks and reviewer sections. Own backend on :3467; ~10 s.
      - name: Task-to-PR e2e (turn becomes a PR with evidence)
        shell: bash
        run: node scripts/qaap-task-to-pr-e2e.mjs --port 3467

      # A multi-step task shows an editable plan, fans out to parallel subtasks in their own worktrees
      # and ends in ONE PR (doc/qaap-task-plan-fanout.md): plan → PATCH edit → Run → ≥ 2 children
      # streaming at once → integration turn → PR whose tree has every subtask's file. Own backend on
      # :3468; ~30 s.
      - name: Task plan fan-out e2e (plan → parallel subtasks → one PR)
        shell: bash
        run: node scripts/qaap-task-plan-fanout-e2e.mjs --port 3468

      - name: Upload gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qaap-predeploy-gate
          path: |
            test-results/qaap-rioja-ui-flow/**
            test-results/browser-server.log
          if-no-files-found: warn

      - name: Stop browser backend
        if: always()
        shell: bash
        run: |
          if [[ -f test-results/browser-server.pid ]]; then
            kill "$(cat test-results/browser-server.pid)" 2>/dev/null || true
          fi

  publish_image:
    name: Publish immutable GHCR image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Build the image while the gate runs: the gate takes ~4 min and the build ~17 min, so waiting
    # for the gate first only adds latency. The deploy job still requires the gate, so a failed gate
    # never reaches the VPS; an image built for a failed gate is just an unused tag in GHCR.
    needs: [resolve_source]
    if: >-
      github.repository == 'juancristobalgd1/qaap'
      && needs.resolve_source.result == 'success'
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.published.outputs.ref }}
      source_sha: ${{ steps.source.outputs.sha }}
      source_short_sha: ${{ steps.source.outputs.short_sha }}

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}

    steps:
      - name: Checkout deploy source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.resolve_source.outputs.sha }}

      - name: Resolve immutable source and image tag
        id: source
        shell: bash
        run: |
          SOURCE_SHA="$(git rev-parse HEAD)"
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SOURCE_SHA:0:12}" >> "$GITHUB_OUTPUT"
          echo "tag=${REGISTRY}/${IMAGE_NAME}:${SOURCE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Resolve QAIQ revision
        id: qaiq
        shell: bash
        run: |
          QAIQ_SHA="$(sed -n 's/^ARG QAIQ_COMMIT=//p' Dockerfile | tr -d '\r')"
          if [[ ! "$QAIQ_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Dockerfile must pin an exact QAIQ commit" >&2
            exit 1
          fi
          echo "sha=$QAIQ_SHA" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      # The deps stage (Dockerfile: npm ci from the package manifests alone) changes only with the
      # manifests. Cache it on its own scope with mode=max: the image build below keeps mode=min (its
      # build-stage layers change every commit and never hit), so without this step every deploy
      # reinstalled node_modules and re-uploaded it as a new layer the VPS pulled twice.
      - name: Build cached dependency stages
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          target: deps
          outputs: type=cacheonly
          no-cache: ${{ github.event.inputs.no_cache == 'true' }}
          cache-from: type=gha,scope=qaap-deps
          cache-to: type=gha,mode=max,scope=qaap-deps,ignore-error=true

      - name: Build and push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.source.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
          build-args: |
            QAAP_BUILD_SHA=${{ steps.source.outputs.short_sha }}
            QAIQ_COMMIT=${{ steps.qaiq.outputs.sha }}
            CACHE_BUST=${{ steps.qaiq.outputs.sha }}
          no-cache: ${{ github.event.inputs.no_cache == 'true' }}
          cache-from: |
            type=gha,scope=qaap-deps
            type=gha,scope=qaap-production
          # mode=min: export only the final image's layers. mode=max also exported the build stage
          # (~159 s per deploy) although it can never hit: the sources are copied before npm ci.
          cache-to: type=gha,mode=min,scope=qaap-production,ignore-error=true

      - name: Export immutable image reference
        id: published
        shell: bash
        run: echo "ref=${{ steps.source.outputs.tag }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  verify_image:
    name: Verify exact candidate image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: publish_image
    if: always() && needs.publish_image.result == 'success'
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout candidate verification scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.publish_image.outputs.source_sha }}
      - name: Use Node.js 24.x
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '24.x'
      - name: Log in to GHCR for candidate pull
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Boot and verify the published digest
        env:
          QAAP_CANDIDATE_IMAGE: ${{ needs.publish_image.outputs.image }}
          QAAP_CANDIDATE_SHA: ${{ needs.publish_image.outputs.source_sha }}
        run: bash scripts/qaap-image-smoke.sh "$QAAP_CANDIDATE_IMAGE" "$QAAP_CANDIDATE_SHA"
      - name: Upload candidate diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qaap-image-smoke
          path: test-results/qaap-image-smoke/
          if-no-files-found: warn

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [gate, publish_image, verify_image]
    # Deploy when the gate passed, or when it was intentionally skipped via workflow_dispatch.
    # A failed/cancelled gate blocks the deploy.
    if: >-
      always()
      && github.repository == 'juancristobalgd1/qaap'
      && needs.gate.result != 'failure'
      && needs.gate.result != 'cancelled'
      && needs.publish_image.result == 'success'
      && needs.verify_image.result == 'success'
    permissions:
      contents: read
      packages: read

    steps:
      - name: Require VPS release configuration
        id: ready
        env:
          QAAP_VPS_HOST: ${{ secrets.QAAP_VPS_HOST }}
          QAAP_VPS_SSH_KEY: ${{ secrets.QAAP_VPS_SSH_KEY }}
          QAAP_VPS_PUBLIC_URL: ${{ secrets.QAAP_VPS_PUBLIC_URL }}
          QAAP_VPS_SSH_FINGERPRINT: ${{ secrets.QAAP_VPS_SSH_FINGERPRINT }}
        run: |
          if [ -z "$QAAP_VPS_HOST" ] || [ -z "$QAAP_VPS_SSH_KEY" ] || [ -z "$QAAP_VPS_PUBLIC_URL" ]; then
            echo "::error::Configure QAAP_VPS_HOST, QAAP_VPS_SSH_KEY and QAAP_VPS_PUBLIC_URL before releasing."
            exit 1
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"
          if [ -z "$QAAP_VPS_SSH_FINGERPRINT" ]; then
            echo "::warning::QAAP_VPS_SSH_FINGERPRINT is not set: the deploy does not verify the VPS host key."
          fi

      - name: Deploy over SSH
        if: steps.ready.outputs.configured == 'true'
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f # v1.2.2
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
          QAAP_DEPLOY_IMAGE: ${{ needs.publish_image.outputs.image }}
          QAAP_DEPLOY_SHA: ${{ needs.publish_image.outputs.source_sha }}
          QAAP_DEPLOY_BRANCH: ${{ env.QAAP_DEPLOY_BRANCH }}
        with:
          host: ${{ secrets.QAAP_VPS_HOST }}
          # Pins the VPS host key (`ssh-keygen -lf /etc/ssh/ssh_host_ecdsa_key.pub` on the VPS: the Go
          # client of ssh-action negotiates ECDSA before ED25519, so an ED25519 fingerprint never
          # matches). Empty means no host-key check: a moved or spoofed host is accepted.
          fingerprint: ${{ secrets.QAAP_VPS_SSH_FINGERPRINT }}
          username: ${{ secrets.QAAP_VPS_USER }}
          key: ${{ secrets.QAAP_VPS_SSH_KEY }}
          port: ${{ secrets.QAAP_VPS_SSH_PORT }}
          command_timeout: 80m
          envs: GHCR_USERNAME,GHCR_TOKEN,QAAP_DEPLOY_IMAGE,QAAP_DEPLOY_SHA,QAAP_DEPLOY_BRANCH
          script: |
            set -euo pipefail
            REPO_DIR="${{ secrets.QAAP_VPS_REPO_DIR || '/opt/qaap' }}"
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
            cd "$REPO_DIR"
            git fetch origin
            if [[ -n "$(git status --porcelain)" ]]; then
              # A VPS can contain an operator's in-progress worktree edits. Preserve tracked and
              # untracked changes before switching to the immutable deploy revision; never force
              # checkout over them. The stash remains on the VPS for explicit recovery later.
              STASH_NAME="qaap-deploy-preserve-${QAAP_DEPLOY_SHA:0:12}-$(date -u +%Y%m%dT%H%M%SZ)"
              git stash push --include-untracked --message "$STASH_NAME"
              echo "[qaap-vps] preserved dirty worktree in stash: $STASH_NAME"
            fi
            git checkout --detach "$QAAP_DEPLOY_SHA"
            ./scripts/qaap-vps-update.sh \
              --branch "$QAAP_DEPLOY_BRANCH" \
              --revision "$QAAP_DEPLOY_SHA" \
              --image "$QAAP_DEPLOY_IMAGE"

      - name: Checkout scripts for health-check URL normalize
        if: steps.ready.outputs.configured == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.publish_image.outputs.source_sha }}
          sparse-checkout: |
            scripts/qaap-vps-normalize-public-url.sh
            scripts/qaap-verify-launch-readiness.sh
            scripts/qaap-release-config-check.js
            scripts/qaap-verify-auth-api-gate.sh
            scripts/qaap-vps-post-deploy-user-smoke.sh
            scripts/qaap-post-deploy-agent-smoke.mjs
          sparse-checkout-cone-mode: false

      - name: Verify public endpoint
        if: steps.ready.outputs.configured == 'true'
        env:
          QAAP_VPS_PUBLIC_URL: ${{ secrets.QAAP_VPS_PUBLIC_URL }}
        run: |
          # shellcheck source=scripts/qaap-vps-normalize-public-url.sh
          source ./scripts/qaap-vps-normalize-public-url.sh
          QAAP_VPS_PUBLIC_URL="$(qaap_normalize_vps_public_url "$QAAP_VPS_PUBLIC_URL")"
          if [ -z "$QAAP_VPS_PUBLIC_URL" ]; then
            echo "::error::QAAP_VPS_PUBLIC_URL is required to verify the release."
            exit 1
          fi
          for attempt in $(seq 1 24); do
            if curl -fsS -o /dev/null "$QAAP_VPS_PUBLIC_URL"; then
              echo "OK: $QAAP_VPS_PUBLIC_URL"
              chmod +x ./scripts/qaap-verify-launch-readiness.sh ./scripts/qaap-verify-auth-api-gate.sh
              QAAP_BASE_URL="$QAAP_VPS_PUBLIC_URL" QAAP_ENV_FILE=/nonexistent.env \
                ./scripts/qaap-verify-launch-readiness.sh
              QAAP_BASE_URL="$QAAP_VPS_PUBLIC_URL" ./scripts/qaap-verify-auth-api-gate.sh
              exit 0
            fi
            echo "waiting for $QAAP_VPS_PUBLIC_URL ($attempt/24)..."
            sleep 10
          done
          echo "Health check failed for $QAAP_VPS_PUBLIC_URL" >&2
          exit 1

      - name: Verify deployed build matches pushed commit
        if: steps.ready.outputs.configured == 'true'
        env:
          QAAP_VPS_PUBLIC_URL: ${{ secrets.QAAP_VPS_PUBLIC_URL }}
        run: |
          # A green "Deploy over SSH" only proves the script ran — NOT that the serving
          # container is the new build (an image-cache miss, a compose no-op, or a user
          # testing mid-rebuild all bit us in practice). The backend bakes QAAP_BUILD_SHA
          # into the image and serves it at /qaap/api/auth/config; assert it is a prefix
          # of the exact source revision baked into the GHCR image.
          # shellcheck source=scripts/qaap-vps-normalize-public-url.sh
          source ./scripts/qaap-vps-normalize-public-url.sh
          QAAP_VPS_PUBLIC_URL="$(qaap_normalize_vps_public_url "$QAAP_VPS_PUBLIC_URL")"
          if [ -z "$QAAP_VPS_PUBLIC_URL" ]; then
            echo "::error::QAAP_VPS_PUBLIC_URL is required to verify the release."
            exit 1
          fi
          DEPLOYED="$(curl -fsS "$QAAP_VPS_PUBLIC_URL/qaap/api/auth/config" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("build") or "")')"
          if [[ ! "$DEPLOYED" =~ ^[0-9a-f]{12}$ ]]; then
            echo "::error::Backend must report the 12-character release SHA."
            exit 1
          fi
          EXPECTED="${{ needs.publish_image.outputs.source_sha }}"
          echo "deployed=$DEPLOYED expected=$EXPECTED image=${{ needs.publish_image.outputs.image }}"
          case "$EXPECTED" in
            "$DEPLOYED"*) echo "OK: serving container runs the exact GHCR source revision." ;;
            *) echo "::error::Deployed build $DEPLOYED does not match GHCR source $EXPECTED."; exit 1 ;;
          esac

      - name: Post-deploy user smoke
        if: steps.ready.outputs.configured == 'true'
        env:
          QAAP_VPS_PUBLIC_URL: ${{ secrets.QAAP_VPS_PUBLIC_URL }}
          QAAP_EXPECTED_BUILD: ${{ needs.publish_image.outputs.source_sha }}
          QAAP_SMOKE_SESSION: ${{ secrets.QAAP_SMOKE_SESSION }}
          QAAP_SMOKE_COOKIE: ${{ secrets.QAAP_SMOKE_COOKIE }}
        run: |
          # shellcheck source=scripts/qaap-vps-normalize-public-url.sh
          source ./scripts/qaap-vps-normalize-public-url.sh
          QAAP_VPS_PUBLIC_URL="$(qaap_normalize_vps_public_url "$QAAP_VPS_PUBLIC_URL")"
          chmod +x ./scripts/qaap-vps-post-deploy-user-smoke.sh
          ./scripts/qaap-vps-post-deploy-user-smoke.sh "$QAAP_VPS_PUBLIC_URL" "$QAAP_EXPECTED_BUILD"

      # One real agent turn as the smoke user (read-only, a random token as the expected reply): the
      # HTTP probes above passed while agents hung in production (cwd ownership 403, turns lost to a
      # backend restart). The release is already serving, so a red result flags it for a rollback
      # (`npm run qaap:vps:rollback`) rather than blocking it.
      - name: Post-deploy agent smoke
        if: steps.ready.outputs.configured == 'true' && github.event.inputs.skip_agent_smoke != 'true'
        env:
          QAAP_VPS_PUBLIC_URL: ${{ secrets.QAAP_VPS_PUBLIC_URL }}
          QAAP_SMOKE_SESSION: ${{ secrets.QAAP_SMOKE_SESSION }}
          QAAP_SMOKE_COOKIE: ${{ secrets.QAAP_SMOKE_COOKIE }}
          # Optional repository variables: the project (github:owner/name) and agent to use.
          QAAP_SMOKE_AGENT_REPO: ${{ vars.QAAP_SMOKE_AGENT_REPO }}
          QAAP_SMOKE_AGENT: ${{ vars.QAAP_SMOKE_AGENT }}
          QAAP_SMOKE_ARTIFACT_DIR: test-results/qaap-agent-smoke
        run: |
          # shellcheck source=scripts/qaap-vps-normalize-public-url.sh
          source ./scripts/qaap-vps-normalize-public-url.sh
          QAAP_VPS_PUBLIC_URL="$(qaap_normalize_vps_public_url "$QAAP_VPS_PUBLIC_URL")"
          node scripts/qaap-post-deploy-agent-smoke.mjs "$QAAP_VPS_PUBLIC_URL"

      - name: Upload agent smoke diagnostics
        if: failure() && steps.ready.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: qaap-agent-smoke
          path: test-results/qaap-agent-smoke/
          if-no-files-found: ignore
