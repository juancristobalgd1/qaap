# Build Qaap once in CI, publish it to GHCR, then pull it on the production VPS over SSH.
# One-time setup: doc/qaap-vps-deployment.md → "Automated deploy"
name: Qaap VPS deploy

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Git branch to deploy on the VPS
        required: false
        default: master
        type: string
      no_cache:
        description: Rebuild Docker image without cache
        required: false
        default: false
        type: boolean
      skip_gate:
        description: Skip the pre-deploy smoke gate (emergency only)
        required: false
        default: false
        type: boolean
      allow_no_rollback:
        description: Allow bootstrap or emergency deploys without an existing rollback target
        required: false
        default: false
        type: boolean
  push:
    branches:
      - master
    paths-ignore:
      - '**/*.md'
      - 'doc/**'
      - 'logo/**'
      - '.github/**'
      - 'examples/playwright/**'

concurrency:
  group: qaap-vps-deploy
  # Never abort an in-flight publish/SSH deploy. A newer push waits its turn.
  cancel-in-progress: false

env:
  QAAP_DEPLOY_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || 'master' }}

jobs:
  resolve_source:
    name: Resolve release commit once
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.repository == 'juancristobalgd1/qaap'
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Checkout requested revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'push' && github.sha || env.QAAP_DEPLOY_BRANCH }}
      - name: Record immutable revision
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Pre-deploy smoke gate: build the browser app, boot it with the mock QAIQ agent, and run the
  # Rioja composer UI-flow eval — which now also asserts runtime shell health (the DI container
  # actually registered its commands). This catches runtime-only regressions that pass compile
  # and build:browser. The deploy job depends on this, so a red gate blocks the VPS deploy.
  gate:
    name: Pre-deploy smoke gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: resolve_source
    if: github.repository == 'juancristobalgd1/qaap' && github.event.inputs.skip_gate != 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.resolve_source.outputs.sha }}

      - name: Use Node.js 24.x
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Use Python 3.13
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'

      - name: Install native-keymap build deps
        shell: bash
        run: bash scripts/qaap-ci-install-native-deps.sh

      - name: Build browser app
        shell: bash
        run: |
          npm ci --include=optional
          npm run build:browser
        env:
          NODE_OPTIONS: --max_old_space_size=4096
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Playwright Chromium
        shell: bash
        run: cd examples/playwright && npx playwright install chromium

      - name: Start browser backend with mock QAIQ
        shell: bash
        # The eval drives the composer UI, which only mounts once past the Work Hub login gate. With
        # no GitHub OAuth configured in CI, the gate shows "sign-in unavailable" and #theia-app-shell
        # never renders — so the gate must boot in skip-auth (local-dev) mode. QAAP_CLOUD_MODE=local
        # keeps QAAP_SKIP_AUTH honored (it is refused in a production runtime).
        env:
          QAAP_SKIP_AUTH: 'true'
          # The mock QAIQ ignores it, but the runner starts a QAIQ task only with a configured provider
          # (the Ollama schema default stopped counting as one); without it every turn fails before spawn.
          OPENROUTER_API_KEY: mock-rioja-e2e
          QAAP_CLOUD_MODE: local
        run: |
          MOCK_BIN="${{ github.workspace }}/test-results/mock-qaiq-bin"
          mkdir -p "${MOCK_BIN}"
          ln -sf "${{ github.workspace }}/examples/playwright/scripts/mock-qaiq-rioja-agent" "${MOCK_BIN}/qaiq"
          echo "${MOCK_BIN}" >> "${GITHUB_PATH}"
          # GITHUB_PATH only affects *subsequent* steps; the backend is started in THIS step and
          # detects agents with `which qaiq`, so it must have the mock on its own PATH.
          export PATH="${MOCK_BIN}:${PATH}"
          cd examples/browser
          npm run start > "${{ github.workspace }}/test-results/browser-server.log" 2>&1 &
          echo $! > "${{ github.workspace }}/test-results/browser-server.pid"
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:3000 >/dev/null; then
              echo "Server ready after ${i} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "Server failed to start"
          tail -n 80 "${{ github.workspace }}/test-results/browser-server.log" || true
          exit 1

      - name: Rioja composer UI flow eval (P0 gate + shell health)
        shell: bash
        run: cd examples/playwright && npm run rioja-ui-flow-eval

      - name: Upload gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qaap-predeploy-gate
          path: |
            test-results/qaap-rioja-ui-flow/**
            test-results/browser-server.log
          if-no-files-found: warn

      - name: Stop browser backend
        if: always()
        shell: bash
        run: |
          if [[ -f test-results/browser-server.pid ]]; then
            kill "$(cat test-results/browser-server.pid)" 2>/dev/null || true
          fi

  publish_image:
    name: Publish immutable GHCR image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [resolve_source, gate]
    # Publish only after the gate passed, or after an explicit emergency skip. Failed gates never
    # produce a deployable image.
    if: >-
      always()
      && github.repository == 'juancristobalgd1/qaap'
      && needs.resolve_source.result == 'success'
      && (needs.gate.result == 'success' || (needs.gate.result == 'skipped' && github.event_name == 'workflow_dispatch' && inputs.skip_gate))
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.published.outputs.ref }}
      source_sha: ${{ steps.source.outputs.sha }}
      source_short_sha: ${{ steps.source.outputs.short_sha }}

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}

    steps:
      - name: Checkout deploy source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.resolve_source.outputs.sha }}

      - name: Resolve immutable source and image tag
        id: source
        shell: bash
        run: |
          SOURCE_SHA="$(git rev-parse HEAD)"
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SOURCE_SHA:0:12}" >> "$GITHUB_OUTPUT"
          echo "tag=${REGISTRY}/${IMAGE_NAME}:${SOURCE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Resolve QAIQ revision
        id: qaiq
        shell: bash
        run: |
          QAIQ_SHA="$(sed -n 's/^ARG QAIQ_COMMIT=//p' Dockerfile | tr -d '\r')"
          if [[ ! "$QAIQ_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Dockerfile must pin an exact QAIQ commit" >&2
            exit 1
          fi
          echo "sha=$QAIQ_SHA" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build and push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.source.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
          build-args: |
            QAAP_BUILD_SHA=${{ steps.source.outputs.short_sha }}
            QAIQ_COMMIT=${{ steps.qaiq.outputs.sha }}
            CACHE_BUST=${{ steps.qaiq.outputs.sha }}
          no-cache: ${{ github.event.inputs.no_cache == 'true' }}
          cache-from: type=gha,scope=qaap-production
          cache-to: type=gha,mode=max,scope=qaap-production,ignore-error=true

      - name: Export immutable image reference
        id: published
        shell: bash
        run: echo "ref=${{ steps.source.outputs.tag }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  verify_image:
    name: Verify exact candidate image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: publish_image
    if: always() && needs.publish_image.result == 'success'
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout candidate verification scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.publish_image.outputs.source_sha }}
      - name: Use Node.js 24.x
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '24.x'
      - name: Log in to GHCR for candidate pull
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Boot and verify the published digest
        env:
          QAAP_CANDIDATE_IMAGE: ${{ needs.publish_image.outputs.image }}
          QAAP_CANDIDATE_SHA: ${{ needs.publish_image.outputs.source_sha }}
        run: bash scripts/qaap-image-smoke.sh "$QAAP_CANDIDATE_IMAGE" "$QAAP_CANDIDATE_SHA"
      - name: Upload candidate diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qaap-image-smoke
          path: test-results/qaap-image-smoke/
          if-no-files-found: warn

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [gate, publish_image, verify_image]
    # Deploy when the gate passed, or when it was intentionally skipped via workflow_dispatch.
    # A failed/cancelled gate blocks the deploy.
    if: >-
      always()
      && github.repository == 'juancristobalgd1/qaap'
      && needs.gate.result != 'failure'
      && needs.gate.result != 'cancelled'
      && needs.publish_image.result == 'success'
      && needs.verify_image.result == 'success'
    permissions:
      contents: read
      packages: read
    outputs:
      result: ${{ steps.summary.outputs.result }}
      reason: ${{ steps.summary.outputs.reason }}

    steps:
      - name: Require VPS release configuration
        id: ready
        env:
          QAAP_VPS_HOST: ${{ secrets.QAAP_VPS_HOST }}
          QAAP_VPS_SSH_KEY: ${{ secrets.QAAP_VPS_SSH_KEY }}
          QAAP_VPS_PUBLIC_URL: ${{ secrets.QAAP_VPS_PUBLIC_URL }}
          QAAP_SMOKE_SESSION: ${{ secrets.QAAP_SMOKE_SESSION }}
          QAAP_SMOKE_COOKIE: ${{ secrets.QAAP_SMOKE_COOKIE }}
          QAAP_VPS_ALLOW_NO_ROLLBACK: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_no_rollback && '1' || '0' }}
        run: |
          if [ -z "$QAAP_VPS_HOST" ] || [ -z "$QAAP_VPS_SSH_KEY" ] || [ -z "$QAAP_VPS_PUBLIC_URL" ]; then
            echo "::error::Configure QAAP_VPS_HOST, QAAP_VPS_SSH_KEY and QAAP_VPS_PUBLIC_URL before releasing."
            exit 1
          fi
          if [ -z "$QAAP_SMOKE_SESSION" ] && [ -z "$QAAP_SMOKE_COOKIE" ]; then
            # Health, build and the release gates still decide rollback; only the signed-in smoke is
            # skipped, and a release verified without it never becomes the rollback target.
            echo "::warning::User smoke skipped (no smoke credentials): configure QAAP_SMOKE_SESSION or QAAP_SMOKE_COOKIE."
            printf '%s\n\n%s\n\n' '## User smoke skipped (no smoke credentials)' 'QAAP_SMOKE_SESSION and QAAP_SMOKE_COOKIE are empty. Health and release gates still run and still trigger rollback; this release cannot become the rollback target.' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Deploy over SSH
        id: deploy
        if: steps.ready.outputs.configured == 'true'
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f # v1.2.2
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
          QAAP_DEPLOY_IMAGE: ${{ needs.publish_image.outputs.image }}
          QAAP_DEPLOY_SHA: ${{ needs.publish_image.outputs.source_sha }}
          QAAP_DEPLOY_BRANCH: ${{ env.QAAP_DEPLOY_BRANCH }}
          QAAP_VPS_PUBLIC_URL: ${{ secrets.QAAP_VPS_PUBLIC_URL }}
          QAAP_SMOKE_SESSION: ${{ secrets.QAAP_SMOKE_SESSION }}
          QAAP_SMOKE_COOKIE: ${{ secrets.QAAP_SMOKE_COOKIE }}
          QAAP_VPS_ALLOW_NO_ROLLBACK: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_no_rollback && '1' || '0' }}
        with:
          host: ${{ secrets.QAAP_VPS_HOST }}
          username: ${{ secrets.QAAP_VPS_USER }}
          key: ${{ secrets.QAAP_VPS_SSH_KEY }}
          port: ${{ secrets.QAAP_VPS_SSH_PORT }}
          command_timeout: 80m
          capture_stdout: true
          envs: GHCR_USERNAME,GHCR_TOKEN,QAAP_DEPLOY_IMAGE,QAAP_DEPLOY_SHA,QAAP_DEPLOY_BRANCH,QAAP_VPS_PUBLIC_URL,QAAP_SMOKE_SESSION,QAAP_SMOKE_COOKIE,QAAP_VPS_ALLOW_NO_ROLLBACK
          script: |
            set -euo pipefail
            REPO_DIR="${{ secrets.QAAP_VPS_REPO_DIR || '/opt/qaap' }}"
            cd "$REPO_DIR"
            # A detached deploy from a cancelled run may still be working; never move the checkout under it.
            if ! flock -n "${QAAP_DEPLOY_LOCK_FILE:-/run/lock/qaap-deploy.lock}" true; then
              printf '%s\n' 'QAAP_DEPLOY_RESULT=blocked' 'QAAP_DEPLOY_REASON=another VPS deploy or rollback is still running' \
                'QAAP_DEPLOY_SUMMARY_START' '## VPS deploy blocked' '' 'Another VPS deploy or rollback still holds the deploy lock. No deployment changes were made.' \
                'QAAP_DEPLOY_SUMMARY_END' 'QAAP_DEPLOY_EXIT_CODE=1'
              exit 0
            fi
            git fetch origin
            if [[ -n "$(git status --porcelain)" ]]; then
              # A VPS can contain an operator's in-progress worktree edits. Preserve tracked and
              # untracked changes before switching to the immutable deploy revision; never force
              # checkout over them. The stash remains on the VPS for explicit recovery later.
              STASH_NAME="qaap-deploy-preserve-${QAAP_DEPLOY_SHA:0:12}-$(date -u +%Y%m%dT%H%M%SZ)"
              git stash push --include-untracked --message "$STASH_NAME"
              echo "[qaap-vps] preserved dirty worktree in stash: $STASH_NAME"
            fi
            git checkout --detach "$QAAP_DEPLOY_SHA"
            export GHCR_USERNAME GHCR_TOKEN QAAP_VPS_ALLOW_NO_ROLLBACK QAAP_SMOKE_SESSION QAAP_SMOKE_COOKIE
            # Detached from this SSH session: a cancelled job, timeout or dropped connection cannot
            # stop a deploy or rollback halfway. The log stays under ~/.local/state/qaap-deploy/logs.
            # Only result markers reach stdout, so the step output stays small.
            bash ./scripts/qaap-vps-detached-run.sh "deploy-${QAAP_DEPLOY_SHA:0:12}" bash -c '
              if ! printf "%s" "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin; then
                printf "QAAP_DEPLOY_RESULT=blocked\nQAAP_DEPLOY_REASON=GHCR login failed\n\nQAAP_DEPLOY_SUMMARY_START\n## VPS deploy blocked\n\nGHCR login failed. No deployment changes were made.\nQAAP_DEPLOY_SUMMARY_END\n"
                exit 1
              fi
              status=0
              bash ./scripts/qaap-vps-rollback.sh "$@" || status=$?
              docker logout ghcr.io >/dev/null 2>&1 || true
              exit "$status"
            ' qaap-deploy "$QAAP_DEPLOY_BRANCH" "$QAAP_DEPLOY_SHA" "$QAAP_DEPLOY_IMAGE" "$QAAP_VPS_PUBLIC_URL"

      # The on-VPS checks reach the public URL from the server itself, which can hide DNS, firewall,
      # CDN or TLS problems (and hairpin NAT can differ). Re-run the release gates from the runner.
      - name: Checkout release verification scripts
        id: external_checkout
        if: steps.ready.outputs.configured == 'true' && contains(steps.deploy.outputs.stdout, 'QAAP_DEPLOY_RESULT=verified')
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.publish_image.outputs.source_sha }}
          sparse-checkout: |
            scripts/qaap-vps-normalize-public-url.sh
            scripts/qaap-verify-launch-readiness.sh
            scripts/qaap-release-config-check.js
            scripts/qaap-verify-auth-api-gate.sh
            scripts/qaap-vps-post-deploy-user-smoke.sh
          sparse-checkout-cone-mode: false

      - name: Verify release from outside the VPS
        id: external
        if: steps.external_checkout.outcome == 'success'
        env:
          QAAP_VPS_PUBLIC_URL: ${{ secrets.QAAP_VPS_PUBLIC_URL }}
          QAAP_SMOKE_SESSION: ${{ secrets.QAAP_SMOKE_SESSION }}
          QAAP_SMOKE_COOKIE: ${{ secrets.QAAP_SMOKE_COOKIE }}
          EXPECTED_SHA: ${{ needs.publish_image.outputs.source_sha }}
        run: |
          # shellcheck source=scripts/qaap-vps-normalize-public-url.sh
          source ./scripts/qaap-vps-normalize-public-url.sh
          BASE_URL="$(qaap_normalize_vps_public_url "$QAAP_VPS_PUBLIC_URL")"
          BASE_URL="${BASE_URL%/}"
          failure='public URL is empty after normalization'
          if [ -n "$BASE_URL" ]; then
            for attempt in $(seq 1 6); do
              echo "external verification attempt $attempt/6"
              if ! QAAP_BASE_URL="$BASE_URL" QAAP_ENV_FILE=/nonexistent.env bash ./scripts/qaap-verify-launch-readiness.sh; then
                failure='launch-readiness gate failed from the runner'
              elif ! QAAP_BASE_URL="$BASE_URL" bash ./scripts/qaap-verify-auth-api-gate.sh; then
                failure='auth API gate failed from the runner'
              elif ! bash ./scripts/qaap-vps-post-deploy-user-smoke.sh "$BASE_URL" "$EXPECTED_SHA"; then
                failure='build or authenticated workspace smoke failed from the runner'
              else
                failure=''
                break
              fi
              sleep 10
            done
          fi
          if [ -n "$failure" ]; then
            echo "::error::External verification failed: $failure"
            echo 'passed=false' >> "$GITHUB_OUTPUT"
            echo "reason=$failure" >> "$GITHUB_OUTPUT"
          else
            echo 'passed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Roll back after external verification failure
        id: external_rollback
        if: steps.external.outputs.passed == 'false'
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f # v1.2.2
        env:
          QAAP_DEPLOY_SHA: ${{ needs.publish_image.outputs.source_sha }}
          QAAP_VPS_PUBLIC_URL: ${{ secrets.QAAP_VPS_PUBLIC_URL }}
          QAAP_SMOKE_SESSION: ${{ secrets.QAAP_SMOKE_SESSION }}
          QAAP_SMOKE_COOKIE: ${{ secrets.QAAP_SMOKE_COOKIE }}
          QAAP_EXTERNAL_REASON: ${{ steps.external.outputs.reason }}
        with:
          host: ${{ secrets.QAAP_VPS_HOST }}
          username: ${{ secrets.QAAP_VPS_USER }}
          key: ${{ secrets.QAAP_VPS_SSH_KEY }}
          port: ${{ secrets.QAAP_VPS_SSH_PORT }}
          command_timeout: 30m
          capture_stdout: true
          envs: QAAP_DEPLOY_SHA,QAAP_VPS_PUBLIC_URL,QAAP_SMOKE_SESSION,QAAP_SMOKE_COOKIE,QAAP_EXTERNAL_REASON
          script: |
            set -euo pipefail
            REPO_DIR="${{ secrets.QAAP_VPS_REPO_DIR || '/opt/qaap' }}"
            cd "$REPO_DIR"
            export QAAP_SMOKE_SESSION QAAP_SMOKE_COOKIE
            bash ./scripts/qaap-vps-detached-run.sh "rollback-${QAAP_DEPLOY_SHA:0:12}" \
              bash ./scripts/qaap-vps-rollback.sh --rollback-only "$QAAP_DEPLOY_SHA" "$QAAP_VPS_PUBLIC_URL" "$QAAP_EXTERNAL_REASON"

      # Source of truth for the release outcome: the "Deploy over SSH" step stays green when the
      # remote script ran, even if it rolled back. Consumers read jobs.deploy.outputs.result.
      - name: Write deploy result summary
        if: always()
        id: summary
        env:
          DEPLOY_OUTPUT: ${{ steps.deploy.outputs.stdout }}
          EXTERNAL_PASSED: ${{ steps.external.outputs.passed }}
          EXTERNAL_REASON: ${{ steps.external.outputs.reason }}
          EXTERNAL_ROLLBACK_OUTPUT: ${{ steps.external_rollback.outputs.stdout }}
          READY: ${{ steps.ready.outputs.configured }}
        run: |
          if [ "$READY" != true ]; then
            exit 0
          fi
          OUTPUT="$DEPLOY_OUTPUT"
          if [ "$EXTERNAL_PASSED" = false ]; then
            printf '%s\n\n%s\n\n' '## External verification failed' "The VPS checks passed, but verification from the GitHub runner failed: $EXTERNAL_REASON. A rollback-only run was started." >> "$GITHUB_STEP_SUMMARY"
            OUTPUT="$EXTERNAL_ROLLBACK_OUTPUT"
          fi
          DEPLOY_RESULT="$(printf '%s\n' "$OUTPUT" | sed -n 's/^QAAP_DEPLOY_RESULT=//p' | tail -n 1)"
          DEPLOY_REASON="$(printf '%s\n' "$OUTPUT" | sed -n 's/^QAAP_DEPLOY_REASON=//p' | tail -n 1)"
          DEPLOY_STATUS="$(printf '%s\n' "$OUTPUT" | sed -n 's/^QAAP_DEPLOY_EXIT_CODE=//p' | tail -n 1)"
          SUMMARY="$(printf '%s\n' "$OUTPUT" | sed -n '/^QAAP_DEPLOY_SUMMARY_START$/,/^QAAP_DEPLOY_SUMMARY_END$/p' | sed '1d;$d')"
          echo "result=${DEPLOY_RESULT:-unknown}" >> "$GITHUB_OUTPUT"
          echo "reason=$DEPLOY_REASON" >> "$GITHUB_OUTPUT"
          if [ -n "$SUMMARY" ]; then
            printf '%s\n' "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n\n%s\n' '## VPS deploy result unavailable' 'The SSH action did not return its deployment summary; inspect the SSH step logs and the VPS log under ~/.local/state/qaap-deploy/logs.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ -z "$DEPLOY_STATUS" ]; then
            echo '::error::SSH completed without returning a deploy status; inspect the SSH step logs.'
            exit 1
          fi
          if [ "$DEPLOY_STATUS" != 0 ] || [ "$DEPLOY_RESULT" != verified ]; then
            echo "::error::VPS deploy result is ${DEPLOY_RESULT:-unknown}: ${DEPLOY_REASON:-deploy did not provide a reason}."
            if [ "$DEPLOY_STATUS" = 0 ]; then exit 1; fi
            exit "$DEPLOY_STATUS"
          fi
