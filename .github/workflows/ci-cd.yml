name: CI/CD

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**/*.md'
      - 'doc/**'
      - 'logo/**'
  workflow_dispatch:
  # No paths-ignore on pull_request: Lint and the ubuntu Build and Test legs are required checks,
  # and a filtered-out required check never reports (docs-only PRs would stay on "Expected").
  pull_request:
    branches:
      - master
    # Default types plus `labeled`, so adding the `ci:full` label starts the windows/macOS legs.
    types: [opened, synchronize, reopened, labeled]

# Why `opened` and `labeled` are split out. `gh pr create --label ci:full` creates the PR and then
# adds the label in a second call, so the `opened` payload usually has NO labels. The `labeled`
# event (ci:full) starts the real run about 1 s later. Both runs used to share the PR group, and
# the first was CANCELLED, which left the required checks blocked (PR #352, #355, #356).
#
# Groups:
#   - `opened` and `labeled` with a label other than ci:full: own group (run_id), never cancel
#     and never cancelled. They do not cancel or get cancelled by the real run for the PR.
#   - synchronize, reopened and labeled with ci:full: PR group, cancel-in-progress. A new push
#     cancels the PR's previous real run.
#   - master pushes and workflow_dispatch: own group (run_id), never cancelled.
#
# The `gate` job decides whether a run is redundant. An `opened` run is redundant when the PR has
# ci:full right now (read through the API, not the payload). A `labeled` run is redundant when its
# label is not ci:full. Redundant runs do NOT skip `lint` and `build`: every step is guarded by
# `if: needs.gate.outputs.redundant != 'true'`, so each job ends SUCCESS in seconds, and the build
# matrix is ubuntu-only, so no work doubles and no runner is taken for windows/macOS.
# Race: if the gate reads the labels before `gh pr create` adds ci:full, the `opened` run does the
# full work too. That is a duplicate, but it is never cancelled. If the API call fails the gate
# answers redundant=false and warns: a duplicate is cheaper than losing CI.
# Required checks must END IN SUCCESS, never SKIPPED: a SKIPPED required check blocks the PR under
# rulesets (mergeStateStatus BLOCKED while the rollup is SUCCESS, PR #368). So `lint` and `build`
# have no job-level `if:`; their steps are guarded instead, and a redundant run reports the same
# check names as success. `concurrency` cannot read job outputs, so its condition repeats the event rules.
concurrency:
  group: ${{ github.workflow }}-${{ (github.event.action == 'opened' || (github.event.action == 'labeled' && github.event.label.name != 'ci:full')) && github.run_id || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'opened' && !(github.event.action == 'labeled' && github.event.label.name != 'ci:full') }}

jobs:

  gate:
    name: CI gate
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      redundant: ${{ steps.decide.outputs.redundant }}
    steps:
      - id: decide
        env:
          EVENT_ACTION: ${{ github.event.action }}
          LABEL_NAME: ${{ github.event.label.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          redundant=false
          if [[ "${EVENT_ACTION}" == "labeled" ]]; then
            if [[ "${LABEL_NAME}" != "ci:full" ]]; then
              redundant=true
            fi
          elif [[ "${EVENT_ACTION}" == "opened" ]]; then
            if labels="$(gh api "repos/${REPO}/issues/${PR_NUMBER}/labels" --paginate --jq '.[].name')"; then
              if grep -qx 'ci:full' <<< "${labels}"; then
                redundant=true
              fi
            else
              echo "::warning::Could not read the PR labels; running CI in full to avoid losing it."
            fi
          fi
          echo "redundant=${redundant}" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint
    needs: gate
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      NODE_OPTIONS: --max_old_space_size=4096
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # https://github.com/microsoft/vscode-ripgrep/issues/9

    steps:
      - name: Redundant run
        if: needs.gate.outputs.redundant == 'true'
        shell: bash
        run: |
          echo "Redundant run: the simultaneous labeled run does the full work."

      - name: Checkout
        if: needs.gate.outputs.redundant != 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Use Node.js 24.x
        if: needs.gate.outputs.redundant != 'true'
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Use Python 3.13
        if: needs.gate.outputs.redundant != 'true'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'

      - name: Install and Build
        if: needs.gate.outputs.redundant != 'true'
        shell: bash
        run: |
          # Same fetch-retry flags, plus whole-install retries (scripts/qaap-npm-ci-retry.sh).
          bash scripts/qaap-npm-ci-retry.sh
          node node_modules/electron/install.js
          ./scripts/check_git_status.sh

      - name: Lint
        if: needs.gate.outputs.redundant != 'true'
        shell: bash
        run: |
          NX_DAEMON=false npx lerna run lint --stream --concurrency 2

  build:
    name: Build and Test (${{ matrix.os }}, node-${{ matrix.node }})
    needs: gate

    strategy:
      fail-fast: false
      matrix:
        # Only the ubuntu legs are required checks. windows/macOS are the slowest legs (20-29 min) and
        # saturate the shared runners, so PRs run them only with the `ci:full` label; master pushes
        # and manual runs always run all three OSes. Redundant runs (gate) are ubuntu-only, with the
        # same job names. The job name above must stay
        # "Build and Test (<os>, node-<node>)": branch protection requires the ubuntu contexts by name.
        os: ${{ fromJSON((needs.gate.outputs.redundant == 'true' && '["ubuntu-22.04"]') || ((github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')) && '["windows-2022", "ubuntu-22.04", "macos-15"]') || '["ubuntu-22.04"]') }}
        node: [22.x, 24.x]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Redundant run
        if: needs.gate.outputs.redundant == 'true'
        shell: bash
        run: |
          echo "Redundant run: the simultaneous labeled run does the full work."

      - name: Checkout
        if: needs.gate.outputs.redundant != 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Use Node.js ${{ matrix.node }}
        if: needs.gate.outputs.redundant != 'true'
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: ${{ matrix.node }}
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Use Python 3.13
        if: needs.gate.outputs.redundant != 'true'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'
      
      - name: Build
        if: needs.gate.outputs.redundant != 'true'
        shell: bash
        run: |
          # Same fetch-retry flags, plus whole-install retries (scripts/qaap-npm-ci-retry.sh).
          bash scripts/qaap-npm-ci-retry.sh
          if [[ "${RUNNER_OS}" == "Windows" && ! -f node_modules/@vscode/windows-ca-certs/build/Release/crypt32.node ]]; then
            fallback_dir="$(mktemp -d)"
            ca_tarball="${fallback_dir}/windows-ca-certs.tgz"
            addon_tarball="${fallback_dir}/node-addon-api.tgz"
            curl -fsSL --retry 5 --retry-all-errors --connect-timeout 20 --max-time 120 \
              'https://registry.npmjs.org/@vscode/windows-ca-certs/-/windows-ca-certs-0.3.4.tgz' \
              -o "${ca_tarball}"
            curl -fsSL --retry 5 --retry-all-errors --connect-timeout 20 --max-time 120 \
              'https://registry.npmjs.org/node-addon-api/-/node-addon-api-8.9.1.tgz' \
              -o "${addon_tarball}"
            verify_integrity() {
              local actual
              actual="$(node -e "const fs=require('fs'),crypto=require('crypto'); process.stdout.write('sha512-'+crypto.createHash('sha512').update(fs.readFileSync(process.argv[1])).digest('base64'))" "$1")"
              test "${actual}" = "$2"
            }
            verify_integrity "${ca_tarball}" \
              'sha512-DcDLjBpu8srh6wUiZqEMyhXHzNDO81ecZOttL3+1u3Iht4CS6Qtxy5WkTPX/aDgbheASO/MK8yg6uLq58RzEWg=='
            verify_integrity "${addon_tarball}" \
              'sha512-4eUQWVPCUUUiBjLnHS3cXWeC6ryoPUc0U3rP7IuzapoGbzMqd/r6KKO0clr0b+snQhsrueFEhCZDdK+LK7hxKg=='
            mkdir -p "${fallback_dir}/ca" "${fallback_dir}/addon"
            tar -xzf "${ca_tarball}" -C "${fallback_dir}/ca"
            tar -xzf "${addon_tarball}" -C "${fallback_dir}/addon"
            rm -rf node_modules/@vscode/windows-ca-certs
            mkdir -p node_modules/@vscode/windows-ca-certs/node_modules/node-addon-api
            cp -R "${fallback_dir}/ca/package/." node_modules/@vscode/windows-ca-certs/
            cp -R "${fallback_dir}/addon/package/." node_modules/@vscode/windows-ca-certs/node_modules/node-addon-api/
            workspace_dir="${PWD}"
            pushd node_modules/@vscode/windows-ca-certs
            node "${workspace_dir}/node_modules/node-gyp/bin/node-gyp.js" rebuild
            popd
          fi
          node node_modules/electron/install.js
          npm run build
          git status
          ./scripts/check_git_status.sh
        env:
          NODE_OPTIONS: --max_old_space_size=4096
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # https://github.com/microsoft/vscode-ripgrep/issues/9

      - name: Download Plugins
        if: needs.gate.outputs.redundant != 'true'
        shell: bash
        run: |
          npm run download:plugins -- --rate-limit 3
          
      - name: Test (headless)
        if: needs.gate.outputs.redundant != 'true' && matrix.tests != 'skip'
        shell: bash
        run: |
          npm run rebuild:browser
          npm run test:theia

      - name: Test (browser)
        if: needs.gate.outputs.redundant != 'true'
        env:
          QAAP_SKIP_AUTH: 'true'
        run: |
          npm run test:browser

      - name: Test (electron)
        # Quarantined (ops/flaky.md): Electron 'after all' hook timeout is runner noise; it still runs and logs,
        # but only blocks when QAAP_RUN_QUARANTINED=1.
        continue-on-error: ${{ vars.QAAP_RUN_QUARANTINED != '1' }}
        if: needs.gate.outputs.redundant != 'true' && runner.os == 'Linux'
        env:
          QAAP_SKIP_AUTH: 'true'
        run: |
          xvfb-run -a npm run test:electron
