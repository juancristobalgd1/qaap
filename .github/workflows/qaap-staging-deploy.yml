name: Qaap staging deploy

# Manual only: never runs from pull requests, forks or pushes (ops/STAGING.md).
on:
  workflow_dispatch:
    inputs:
      action:
        description: deploy (stage an existing image), build (build a branch image, then stage it) or stop (take it down and unpublish it)
        required: true
        default: deploy
        type: choice
        options: [deploy, build, stop]
      image:
        description: Immutable GHCR image to stage (ghcr.io/...@sha256:...), required for deploy
        required: false
        type: string
      ref:
        description: Branch or commit to build for staging, required for build (never deployed to production)
        required: false
        type: string
      copy_operator_data:
        description: Refresh the staging copy of the operator's data (copied inside the VPS only)
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  packages: read

concurrency:
  group: qaap-staging-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build staging image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.repository == 'juancristobalgd1/qaap' && inputs.action == 'build'
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.published.outputs.ref }}
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - name: Validate ref
        env:
          REF: ${{ inputs.ref }}
        run: |
          if [ -z "$REF" ]; then
            echo "::error::ref is required for build"
            exit 1
          fi

      - name: Checkout ref to stage
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}

      - name: Resolve source and staging tag
        id: source
        shell: bash
        run: |
          SOURCE_SHA="$(git rev-parse HEAD)"
          QAIQ_SHA="$(sed -n 's/^ARG QAIQ_COMMIT=//p' Dockerfile | tr -d '\r')"
          if [[ ! "$QAIQ_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Dockerfile must pin an exact QAIQ commit" >&2
            exit 1
          fi
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SOURCE_SHA:0:12}" >> "$GITHUB_OUTPUT"
          echo "qaiq=$QAIQ_SHA" >> "$GITHUB_OUTPUT"
          # staging- prefix keeps branch images apart from the production tags (<full sha>).
          echo "tag=${REGISTRY}/${IMAGE_NAME}:staging-${SOURCE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build and push staging image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.source.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
          build-args: |
            QAAP_BUILD_SHA=${{ steps.source.outputs.short_sha }}
            QAIQ_COMMIT=${{ steps.source.outputs.qaiq }}
            CACHE_BUST=${{ steps.source.outputs.qaiq }}
          # Reads the production layer cache, writes only its own scope so staging never evicts it.
          cache-from: |
            type=gha,scope=qaap-production
            type=gha,scope=qaap-staging
          cache-to: type=gha,mode=max,scope=qaap-staging,ignore-error=true

      - name: Export immutable image reference
        id: published
        shell: bash
        run: |
          REF="${{ steps.source.outputs.tag }}@${{ steps.build.outputs.digest }}"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Staging image: \`$REF\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "$GITHUB_REF" != "refs/heads/master" ]; then
            echo "Built from a non-master workflow ref: not staged. Stage it with action=deploy from master." >> "$GITHUB_STEP_SUMMARY"
          fi

  stage:
    needs: build
    name: Staging ${{ inputs.action == 'build' && 'deploy' || inputs.action }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Secrets and SSH only from the trusted workflow on master: a dispatch from another
    # branch runs that branch's copy of this file, so it may build but never stage.
    if: always() && github.repository == 'juancristobalgd1/qaap' && github.ref == 'refs/heads/master' && (inputs.action != 'build' || needs.build.result == 'success')
    environment: Preview
    steps:
      - name: Validate inputs
        env:
          ACTION: ${{ inputs.action == 'build' && 'deploy' || inputs.action }}
          IMAGE: ${{ inputs.action == 'build' && needs.build.outputs.ref || inputs.image }}
        run: |
          if [ "$ACTION" = "deploy" ] && ! [[ "$IMAGE" =~ ^ghcr\.io/[a-z0-9._/-]+(:[A-Za-z0-9._-]+)?@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::image must be an immutable ghcr.io reference with @sha256 digest"
            exit 1
          fi

      - name: Run on the VPS over SSH
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f # v1.2.2
        env:
          ACTION: ${{ inputs.action == 'build' && 'deploy' || inputs.action }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
          QAAP_STAGING_IMAGE: ${{ inputs.action == 'build' && needs.build.outputs.ref || inputs.image }}
          COPY_DATA: ${{ inputs.copy_operator_data }}
          # Separate GitHub OAuth app for https://staging.<host> (Preview environment secrets).
          STAGING_CLIENT_ID: ${{ secrets.QAAP_STAGING_GITHUB_CLIENT_ID }}
          STAGING_CLIENT_SECRET: ${{ secrets.QAAP_STAGING_GITHUB_CLIENT_SECRET }}
        with:
          host: ${{ secrets.QAAP_VPS_HOST }}
          username: ${{ secrets.QAAP_VPS_USER }}
          key: ${{ secrets.QAAP_VPS_SSH_KEY }}
          port: ${{ secrets.QAAP_VPS_SSH_PORT }}
          command_timeout: 25m
          envs: ACTION,GHCR_USERNAME,GHCR_TOKEN,QAAP_STAGING_IMAGE,COPY_DATA,STAGING_CLIENT_ID,STAGING_CLIENT_SECRET
          script: |
            set -euo pipefail
            REPO_DIR="${{ secrets.QAAP_VPS_REPO_DIR || '/opt/qaap' }}"
            STAGE=/opt/qaap-staging
            ENABLED="$REPO_DIR/deploy/caddy/staging-enabled"
            reload_caddy() { docker exec qaap-caddy-1 caddy reload --config /etc/caddy/Caddyfile; }
            cd "$REPO_DIR"
            QAAP_PUBLIC_HOST="$(sed -n 's/^QAAP_PUBLIC_HOST=//p' .env)"
            if [ "$ACTION" = "stop" ]; then
              rm -f "$ENABLED/staging.caddy"
              reload_caddy
              QAAP_STAGING_IMAGE=unused QAAP_PUBLIC_HOST="$QAAP_PUBLIC_HOST" \
                docker compose -p qaap-staging -f deploy/staging/compose.staging.yml down
              echo "staging stopped and unpublished"
              exit 0
            fi
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
            mkdir -p "$STAGE"/{workspace,worktrees,parallel,auth/users,theia-user}
            if [ -n "$STAGING_CLIENT_ID" ] && [ -n "$STAGING_CLIENT_SECRET" ]; then
              ( umask 077; printf 'QAAP_GITHUB_CLIENT_ID=%s\nQAAP_GITHUB_CLIENT_SECRET=%s\n' "$STAGING_CLIENT_ID" "$STAGING_CLIENT_SECRET" > "$STAGE/staging.env" )
            fi
            test -f "$STAGE/staging.env" || { echo "::error::no staging OAuth app: set QAAP_STAGING_GITHUB_CLIENT_ID/SECRET in the Preview environment"; exit 1; }
            if [ "$COPY_DATA" = "true" ]; then
              # Consistent online copy with SQLite's backup API, inside the VPS. Never leaves the host.
              python3 - <<'PY'
            import os, sqlite3
            src_root, dst_root = '/opt/qaap-runtime/auth/users', '/opt/qaap-staging/auth/users'
            for login in ('juancristobalgd1', 'jcristgd'):
                src = os.path.join(src_root, login, 'tenant.sqlite')
                if not os.path.exists(src):
                    continue
                os.makedirs(os.path.join(dst_root, login), exist_ok=True)
                dst = os.path.join(dst_root, login, 'tenant.sqlite')
                with sqlite3.connect(f'file:{src}?mode=ro', uri=True) as s, sqlite3.connect(dst) as d:
                    s.backup(d)
                print('copied', login)
            PY
            fi
            # Same owner as production's /opt/qaap-runtime: the rootless daemon maps it to the
            # container user. Root-owned binds fail with EACCES on /home/theia/.qaap.
            OWNER="$(stat -c %u:%g /opt/qaap-runtime/auth)"
            chown -R "$OWNER" "$STAGE"/workspace "$STAGE"/worktrees "$STAGE"/parallel "$STAGE"/auth "$STAGE"/theia-user
            docker pull "$QAAP_STAGING_IMAGE"
            QAAP_STAGING_IMAGE="$QAAP_STAGING_IMAGE" QAAP_PUBLIC_HOST="$QAAP_PUBLIC_HOST" \
              docker compose -p qaap-staging -f deploy/staging/compose.staging.yml up -d --no-build --force-recreate
            healthy=0
            for i in $(seq 1 60); do
              if curl -fsS -m 5 http://127.0.0.1:4874/qaap/api/health >/dev/null; then healthy=1; break; fi
              sleep 5
            done
            if [ "$healthy" != 1 ]; then
              echo "::error::staging did not become healthy"; docker logs --tail 80 qaap-staging-theia || true; exit 1
            fi
            cp deploy/caddy/staging.caddy "$ENABLED/staging.caddy"
            reload_caddy
            echo "staging healthy at https://staging.$QAAP_PUBLIC_HOST"
