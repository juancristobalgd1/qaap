name: Production Build Smoke Test

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**/*.md'
      - 'doc/**'
      - 'logo/**'
  workflow_dispatch:
  # No paths-ignore on pull_request: this workflow is a required check, and a filtered-out
  # required check never reports (docs-only PRs would stay on "Expected").
  pull_request:
    branches:
      - master

# A new push to a PR cancels that PR's previous run. Every non-PR run (master push, schedule,
# workflow_dispatch) gets its own group via run_id, so it is never cancelled or replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test-playwright:
    name: Smoke Test for Browser Example Production Build on ubuntu-22.04 with Node.js 24.x

    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Use Node.js "24.x"
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Use Python 3.13
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Build Browser Example Application for Production
        shell: bash
        run: |
          bash scripts/qaap-npm-ci-retry.sh
          cd examples/browser && npm run build:production
        env:
          NODE_OPTIONS: --max_old_space_size=4096
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # https://github.com/microsoft/vscode-ripgrep/issues/9

      - name: Cache Playwright browsers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          # Playwright's default install path on Linux. Keyed on the lockfile so the cache
          # is reused as long as the @playwright/test version (and therefore the required
          # Chromium build) does not change. After the first successful extraction the
          # `playwright install` step becomes a no-op.
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Build Playwright
        shell: bash
        run: |
          cd examples/playwright && npm run build

      - name: Run Smoke Test (examples/playwright/src/tests/theia-app)
        shell: bash
        # Exercise the production shell, not the unauthenticated login gate. This is the same
        # local-only test mode used by the pre-deploy gate; the smoke test itself still runs.
        env:
          QAAP_SKIP_AUTH: 'true'
          QAAP_CLOUD_MODE: local
        run: npm run test:playwright -- theia-app
