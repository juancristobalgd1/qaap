name: Playwright Tests

on:
  push:
    branches:
      - master
    paths-ignore:
      - "**/*.md"
      - "doc/**"
      - "logo/**"
  workflow_dispatch:
  pull_request:
    branches:
      - master
    paths-ignore:
      - "**/*.md"
      - "doc/**"
      - "logo/**"
  schedule:
    - cron: "0 4 * * *" # Runs every day at 4am: https://docs.github.com/en/actions/reference/events-that-trigger-workflows#scheduled-events-schedule

jobs:
  build-and-test-playwright:
    name: Playwright Tests (ubuntu-22.04,  Node.js 24.x)

    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Use Node.js "24.x"
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"

      - name: Use Python 3.13
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Install IPython Kernel
        shell: bash
        run: |
          python3 -m pip install ipykernel==6.15.2
          python3 -m ipykernel install --user

      - name: Build Browser
        shell: bash
        run: |
          npm ci
          npm run build:browser
          npm run download:plugins
        env:
          NODE_OPTIONS: --max_old_space_size=4096
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # https://github.com/microsoft/vscode-ripgrep/issues/9

      - name: Cache Playwright browsers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          # Playwright's default install path on Linux. Keyed on the lockfile so the cache
          # is reused as long as the @playwright/test version (and therefore the required
          # Chromium build) does not change. After the first successful extraction the
          # `playwright install` step becomes a no-op.
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Build Playwright
        shell: bash
        run: |
          cd examples/playwright && npm run build

      - name: Test (playwright)
        shell: bash
        # Qaap: playwright.qaap-upstream-ci.config.ts = upstream CI config minus the `@qaap-mobile`
        # specs (run by qaap-mobile-playwright.yml with their own fixtures/env/timeouts) and minus the
        # upstream specs whose page objects depend on workbench chrome Qaap replaces (reasons inline).
        # Including them made every run hit the 60 min job timeout before reporting anything.
        # The playwright package is already built by the previous step.
        run: cd examples/playwright && npx playwright test --config=./configs/playwright.qaap-upstream-ci.config.ts
        env:
          # Qaap: without these the local backend rejects unauthenticated file-system RPCs
          # ("Not signed in") and the login gate covers the workbench.
          QAAP_SKIP_AUTH: 'true'
          QAAP_CLOUD_MODE: local
          # Qaap: open the classic IDE surface (per-tab "Open IDE" preference) instead of the
          # default Work Hub, which the upstream suite does not know about. See theia-app-loader.ts.
          QAAP_PLAYWRIGHT_SURFACE: ide

      - name: Archive test results
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ !cancelled() }}
        with:
          name: playwright-test-results
          path: |
            examples/playwright/test-results/
            examples/playwright/playwright-report/
          retention-days: 7
